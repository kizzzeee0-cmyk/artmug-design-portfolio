<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><meta name="theme-color" content="#9389de"><title>칠공 작업 안내 & 포트폴리오</title><link rel="stylesheet" href="./css/style.css"></head><body><main class="site-shell"><section class="author-intro" id="authorIntro" hidden><img id="authorImage" alt="작가 소개 이미지"><p id="authorText" class="preline"></p></section><section class="events-section" id="eventsSection" hidden><span id="eventsKicker" class="section-kicker">EVENTS</span><h2 id="eventsTitle"></h2><p id="eventsText" class="preline"></p></section>
<section class="notice-stack"><article class="card info-card schedule-card"><span class="section-kicker">SCHEDULE</span><h2 id="scheduleTitle">작업 일정 안내</h2><p id="scheduleText" class="preline"></p></article><article class="card info-card notice-card"><div class="notice-heading"><div><span class="section-kicker">NOTICE</span><h2 id="noticeTitle">공지사항</h2></div><span class="notice-sparkle">♡</span></div><div id="noticeItems" class="notice-list"></div></article></section>
<section class="card comparison-section" id="comparisonSection" hidden><div class="comparison-heading"><div><span class="section-kicker">PROFILE TYPE</span><h2 id="comparisonTitle"></h2><p id="comparisonDescription" class="muted preline"></p></div><span class="comparison-badge">A ↔ B</span></div><div class="comparison-grid"><article class="comparison-item"><div class="comparison-media"><img id="comparisonAImage" alt="움짤프사 A 예시"><div id="comparisonAPlaceholder" class="comparison-placeholder">A</div></div><div class="comparison-copy"><span class="comparison-type-pill">TYPE A</span><h3 id="comparisonALabel"></h3><p id="comparisonADescription" class="muted preline"></p></div></article><article class="comparison-item"><div class="comparison-media"><img id="comparisonBImage" alt="움짤프사 B 예시"><div id="comparisonBPlaceholder" class="comparison-placeholder">B</div></div><div class="comparison-copy"><span class="comparison-type-pill">TYPE B</span><h3 id="comparisonBLabel"></h3><p id="comparisonBDescription" class="muted preline"></p></div></article></div><p id="comparisonFooter" class="comparison-footer preline"></p></section>
<section class="card form-card"><div class="section-heading"><div><span class="section-kicker">CONTACT</span><h2 id="formTitle">문의양식</h2></div><p id="formDescription" class="muted"></p></div><div class="contact-form"><label><span id="nicknameLabel"></span><input id="nicknameInput" type="text"></label><label><span id="designTypeLabel"></span><select id="designTypeInput"></select></label><div id="signatureFields" class="span-2 signature-fields" hidden><label><span id="signatureNumberLabel"></span><input id="signatureNumberInput"></label><label><span id="signatureContentLabel"></span><textarea id="signatureContentInput"></textarea></label></div><fieldset id="frameKeepField" class="span-2 choice-field"><legend id="frameKeepLabel"></legend><p id="frameKeepDescription" class="field-help preline"></p><div class="choice-row"><label class="choice-pill"><input name="frameKeep" type="radio" value="O" checked><span id="frameKeepYes"></span></label><label class="choice-pill"><input name="frameKeep" type="radio" value="X"><span id="frameKeepNo"></span></label></div></fieldset><label class="span-2"><span id="conceptLabel"></span><textarea id="conceptInput"></textarea></label><label class="span-2"><span id="extraLabel"></span><textarea id="extraInput"></textarea></label><div class="span-2 form-actions"><button id="copyButton" class="primary-button" type="button"></button><span id="copyStatus" class="status-text"></span></div></div></section>
<section class="card portfolio-card"><div class="portfolio-header"><div><span class="section-kicker">PORTFOLIO</span><h2 id="portfolioTitle">포트폴리오</h2></div><div id="portfolioTabs" class="tabs"></div></div><div id="portfolioStatus" class="portfolio-status"></div><div id="portfolioGrid" class="portfolio-grid"></div><nav id="pagination" class="pagination"></nav></section>
<section class="card preset-section" id="presetSection" hidden><div class="portfolio-header"><div><span class="section-kicker">PRESET</span><h2 id="presetTitle">미판매 프리셋</h2></div><span class="comparison-badge">PRESET</span></div><p id="presetNotice" class="preset-notice preline"></p><div id="presetTabs" class="tabs"></div><div id="presetStatus" class="portfolio-status"></div><div id="presetGrid" class="portfolio-grid"></div><nav id="presetPagination" class="pagination"></nav></section>
<footer id="footerText" class="footer muted"></footer></main><dialog id="lightbox" class="lightbox"><button id="lightboxClose" class="lightbox-close">×</button><img id="lightboxImage" alt="확대 이미지"></dialog><script src="./js/config.js"></script><script src="./js/app.js"></script></body></html>
