<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>모바일 빠른 이동</title>
<style>
  *{box-sizing:border-box}
  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
    font-family:"Paperlogy",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
    -webkit-transform:translateZ(0);
    transform:translateZ(0);
    -webkit-backface-visibility:hidden;
    backface-visibility:hidden;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:2px;
  }
  .mobile-nav{
    width:100%;
    height:52px;
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    align-items:center;
    padding:4px 7px;
    border:1px solid #dcecf4;
    border-radius:19px;
    background:#ffffff;
    box-shadow:none;
    -webkit-transform:translateZ(0);
    transform:translateZ(0);
    -webkit-backface-visibility:hidden;
    backface-visibility:hidden;
    will-change:transform;
  }
  .mobile-nav button{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    min-width:0;
    height:42px;
    padding:3px 5px;
    border:0;
    border-radius:13px;
    background:transparent;
    color:#617887;
    font:inherit;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .mobile-nav button:active{
    background:#f1f9fd;
    color:#69add2;
  }
  .mobile-nav svg{
    width:16px;
    height:16px;
    display:block;
    fill:none;
    stroke:currentColor;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .mobile-nav span{
    font-size:10px;
    font-weight:600;
    line-height:1.2;
    white-space:nowrap;
  }
  .mobile-nav .top-button{
    background:#8fc8e8;
    color:#ffffff;
  }
  .mobile-nav .top-button:hover,
  .mobile-nav .top-button:focus-visible{
    background:#8fc8e8;
    color:#ffffff;
    outline:none;
  }
  .mobile-nav .top-button:active{
    background:#78b9df;
    color:#ffffff;
  }
</style>
</head>
<body>
<nav class="mobile-nav" aria-label="모바일 빠른 이동">
  <button type="button" data-target="inquiry" aria-label="문의양식으로 이동">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="5" y="3.5" width="14" height="17" rx="2"></rect>
      <path d="M8.5 8h7M8.5 12h7M8.5 16h4.5"></path>
    </svg>
    <span>문의양식</span>
  </button>

  <button type="button" data-target="portfolio" aria-label="포트폴리오로 이동">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3.5" y="4" width="17" height="16" rx="2"></rect>
      <circle cx="9" cy="9" r="1.5"></circle>
      <path d="M5.5 17l4.2-4.3 3 2.8 2.4-2.4 3.4 3.9"></path>
    </svg>
    <span>포트폴리오</span>
  </button>

  <button type="button" class="top-button" data-target="top" aria-label="맨 위로 이동">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M6 10l6-6 6 6"></path>
      <path d="M12 4v16"></path>
    </svg>
    <span>맨 위로</span>
  </button>
</nav>

<script>
(function(){
  const channelName='artmug-portfolio-section-nav';
  const channel=('BroadcastChannel' in window)?new BroadcastChannel(channelName):null;
  let locked=false;

  function send(target){
    if(locked)return;
    locked=true;

    if(target==='top'){
      try{
        window.parent.postMessage({
          type:'artmug-mobile-top'
        },'*');
      }catch(e){}
    }else if(channel){
      channel.postMessage({
        type:'navigate',
        target:target
      });
    }

    setTimeout(function(){
      locked=false;
    },160);
  }

  document.querySelectorAll('[data-target]').forEach(function(btn){
    btn.addEventListener('click',function(){
      send(btn.dataset.target);
    });
  });
})();;
</script>
</body>
</html>
