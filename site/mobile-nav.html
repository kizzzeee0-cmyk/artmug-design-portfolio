<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>모바일 빠른 이동</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;overflow:hidden;background:transparent;font-family:"Paperlogy",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
body{padding:2px}.wrap{width:100%}.mobile-nav{width:100%;height:52px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center;padding:4px 7px;border:1px solid #dcecf4;border-radius:19px;background:#fff}
.mobile-nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:42px;padding:3px 5px;border:0;border-radius:13px;background:transparent;color:#617887;font:inherit;cursor:pointer}.mobile-nav button:active{background:#f1f9fd;color:#69add2}.mobile-nav svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.mobile-nav span{font-size:10px;font-weight:650;white-space:nowrap}.mobile-nav .inquiry{background:#69add2;color:#fff}.mobile-nav .top{color:#69add2}
.panel{display:none;margin-top:6px;max-height:350px;overflow:auto;padding:8px;border:1px solid #dcecf4;border-radius:16px;background:#fff}.wrap.is-open .panel{display:block}.panel button,.panel summary{display:block;width:100%;min-height:36px;padding:8px 10px;border:0;border-radius:9px;background:transparent;color:#617887;font:inherit;font-size:11.5px;font-weight:650;text-align:left;cursor:pointer;list-style:none}.panel summary{display:flex;justify-content:space-between;align-items:center}.panel summary::-webkit-details-marker{display:none}.panel summary::after{content:"▾";font-size:9px}.panel details[open] summary::after{content:"▴"}.panel button:active,.panel summary:active{background:#edf8fd;color:#4f8fb3}.sub{padding-left:10px}.sub button{min-height:32px;font-size:10.5px}.loading{padding:10px;text-align:center;color:#81909a;font-size:10px}
</style></head>
<body><div class="wrap" id="wrap">
<nav class="mobile-nav" aria-label="모바일 빠른 이동">
<button type="button" id="quick"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"></path></svg><span>빠른 이동</span></button>
<button type="button" class="inquiry" data-target="inquiry"><svg viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17" rx="2"></rect><path d="M8.5 8h7M8.5 12h7M8.5 16h4.5"></path></svg><span>문의 양식</span></button>
<button type="button" class="top" data-target="top"><svg viewBox="0 0 24 24"><path d="M6 10l6-6 6 6"></path><path d="M12 4v16"></path></svg><span>TOP</span></button>
</nav>
<div class="panel" id="panel"><div class="loading">메뉴 불러오는 중…</div></div>
</div>
<script src="/js/config.js"></script>
<script>
(function(){
 const C=window.ARTMUG_CONFIG||{},API=C.API_BASE||'',RAW='https://raw.githubusercontent.com/kizzzeee0-cmyk/artmug-design-portfolio/main/',wrap=document.getElementById('wrap'),panel=document.getElementById('panel'),CACHE_KEY='artmug-nav-summary-v4',ch=('BroadcastChannel'in window)?new BroadcastChannel('artmug-portfolio-section-nav'):null;
 const api=async p=>{const r=await fetch(API+p,{credentials:'include'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()};
 const raw=async p=>{const r=await fetch(RAW+p,{cache:'no-cache'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()};
 function layout(c){const id=String(c?.id||''),l=String(c?.label||'').replace(/\s/g,'');if(id==='top-banner'||l.includes('상단배너'))return'top-banner';if(id==='floating-banner'||l.includes('플로팅'))return'floating-banner';if(id==='bottom-banner'||l.includes('하단배너일반'))return'bottom-banner';if(id==='bottom-split'||l.includes('하단배너분할'))return'bottom-split';if(/4cut|four-cut/.test(id)||l.includes('인생네컷'))return'four-cut';return id}
 function summarize(settings,index,presets){
  const meta=settings.portfolioMeta||{},pm=settings.presetMeta||{},cats=(settings.portfolioCategories||[]).filter(c=>c.enabled!==false&&!c.hiddenLegacy),catById=new Map(cats.map(c=>[c.id,c]));
  const works=(Array.isArray(index)?index:[]).filter(x=>x&&catById.has(x.category)&&(meta[x.file]||{}).enabled!==false),bannerKinds=new Set(['top-banner','floating-banner','bottom-banner','bottom-split']),bannerWorks=works.filter(x=>bannerKinds.has(layout(catById.get(x.category)))),presetItems=(Array.isArray(presets)?presets:[]).filter(x=>x&&x.enabled!==false&&(pm[x.file]||{}).enabled!==false);
  return {
   hasPreset:settings.presetEnabled!==false&&settings.showcasePresetEnabled!==false&&presetItems.some(x=>((pm[x.file]||{}).showcaseKind||(x.category==='floating-banner'?'fixed':'preset'))!=='fixed'),
   hasFixed:settings.presetEnabled!==false&&settings.showcaseFixedEnabled!==false&&presetItems.some(x=>((pm[x.file]||{}).showcaseKind||(x.category==='floating-banner'?'fixed':'preset'))==='fixed'),
   hasA:bannerWorks.some(x=>(meta[x.file]||{}).isFixed!==true&&((meta[x.file]||{}).bannerType||'B')==='A'),
   hasB:bannerWorks.some(x=>(meta[x.file]||{}).isFixed!==true&&((meta[x.file]||{}).bannerType||'B')==='B'),
   fourCutId:works.find(x=>layout(catById.get(x.category))==='four-cut')?.category||''
  }
 }
 function report(){try{window.parent.postMessage({type:'artmug-mobile-nav-height',height:wrap.classList.contains('is-open')?Math.min(410,wrap.scrollHeight+4):56},'*')}catch{}}
 function close(){wrap.classList.remove('is-open');report()}
 function send(target){if(ch)ch.postMessage({type:'navigate',target});try{window.parent.postMessage({type:'artmug-section-nav',target},'*')}catch{};close()}
 function html(d){let h='<button type="button" data-target="notice">공지사항</button>';if(d.hasPreset)h+='<button type="button" data-target="showcase-preset">미판매 프리셋</button>';if(d.hasFixed)h+='<button type="button" data-target="showcase-fixed">고정틀</button>';if(d.hasA)h+='<button type="button" data-target="banner:A">배너 TYPE A</button>';if(d.hasB)h+='<button type="button" data-target="banner:B">배너 TYPE B</button>';if(d.fourCutId)h+='<button type="button" data-target="portfolio:'+d.fourCutId+'">인생네컷</button>';return h}
 function show(d){panel.innerHTML=html(d);panel.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>send(b.dataset.target));report()}
 function cached(){try{const x=JSON.parse(sessionStorage.getItem(CACHE_KEY)||'null');return x&&Date.now()-x.time<60000?x.data:null}catch{return null}}
 function saveCache(data){try{sessionStorage.setItem(CACHE_KEY,JSON.stringify({time:Date.now(),data}))}catch{}}
 document.getElementById('quick').onclick=()=>{wrap.classList.toggle('is-open');report()};
 document.querySelectorAll('.mobile-nav [data-target]').forEach(b=>b.onclick=()=>send(b.dataset.target));
 async function init(){const old=cached();if(old)show(old);try{const [d,index,presets]=await Promise.all([api('/api/public/settings?fresh='+Date.now()),raw('portfolio/index.json'),raw('site/data/presets.json')]);const summary=summarize(d.settings||{},index,presets);saveCache(summary);show(summary)}catch{if(!old)show({hasPreset:false,hasFixed:false,hasA:false,hasB:false,fourCutId:''})}}
 init();report()
})();;;
</script></body></html>
