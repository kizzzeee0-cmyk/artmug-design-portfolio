<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>빠른 이동</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent;font-family:"Paperlogy",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
body{display:flex;justify-content:flex-start;align-items:flex-start;min-height:100vh}
.quick-nav{position:sticky;top:8px;width:154px;padding:9px;border:1px solid #dcecf4;border-radius:16px;background:#fff}
.nav-list{display:grid;gap:2px}.quick-nav button,.quick-nav summary{width:100%;min-height:33px;padding:7px 9px;border:0;border-radius:9px;background:transparent;color:#617887;font:inherit;font-size:11.5px;font-weight:650;line-height:1.35;text-align:left;cursor:pointer;list-style:none}
.quick-nav summary::-webkit-details-marker{display:none}.quick-nav summary{display:flex;align-items:center;justify-content:space-between}.quick-nav summary::after{content:"▾";font-size:9px}.quick-nav details[open] summary::after{content:"▴"}
.quick-nav button:hover,.quick-nav button:focus-visible,.quick-nav summary:hover{background:#edf8fd;color:#5a9bbf;outline:none}
.submenu{display:grid;gap:1px;padding:2px 0 4px 10px}.submenu button{min-height:29px;font-size:10.5px;font-weight:600;padding:5px 7px}
.quick-nav button.is-active{background:#edf8fd;color:#4f8fb3}.divider{height:1px;margin:7px 4px;background:#dcecf4}
.inquiry-button{background:#69add2!important;color:#fff!important;text-align:center!important;font-weight:750!important}.inquiry-button:hover{background:#5b9fc5!important;color:#fff!important}
.top-button{color:#69add2!important;text-align:center!important}
.loading{padding:8px;color:#81909a;font-size:10px;text-align:center}
</style>
</head>
<body>
<nav class="quick-nav" aria-label="페이지 빠른 이동"><div id="navList" class="nav-list"><div class="loading">메뉴 불러오는 중…</div></div></nav>
<script src="/js/config.js"></script>
<script>
(function(){
const API=(window.ARTMUG_CONFIG||{}).API_BASE||'',RAW='https://raw.githubusercontent.com/kizzzeee0-cmyk/artmug-design-portfolio/main/',root=document.getElementById('navList'),CACHE_KEY='artmug-nav-summary-v6';
const ch=('BroadcastChannel' in window)?new BroadcastChannel('artmug-portfolio-section-nav'):null;
let currentSummary={};
const api=async p=>{const r=await fetch(API+p,{credentials:'include'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()};
const raw=async p=>{const r=await fetch(RAW+p,{cache:'no-cache'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()};
function layout(c){
 const id=String(c?.id||''),label=String(c?.label||'').replace(/\s/g,'');
 if(id==='top-banner'||label.includes('상단배너'))return'top-banner';
 if(id==='floating-banner'||label.includes('플로팅'))return'floating-banner';
 if(id==='bottom-banner'||label.includes('하단배너일반'))return'bottom-banner';
 if(id==='bottom-split'||label.includes('하단배너분할'))return'bottom-split';
 if(/4cut|four-cut/.test(id)||label.includes('인생네컷'))return'four-cut';
 return id
}
function summarize(settings,index,presets){
 const meta=settings.portfolioMeta||{},pm=settings.presetMeta||{};
 const cats=(settings.portfolioCategories||[]).filter(c=>c.enabled!==false&&!c.hiddenLegacy),catById=new Map(cats.map(c=>[c.id,c]));
 const works=(Array.isArray(index)?index:[]).filter(x=>x&&catById.has(x.category)&&(meta[x.file]||{}).enabled!==false);
 const banners=new Set(['top-banner','floating-banner','bottom-banner','bottom-split']);
 const bannerWorks=works.filter(x=>banners.has(layout(catById.get(x.category))));
 const presetItems=(Array.isArray(presets)?presets:[]).filter(x=>x&&x.enabled!==false&&(pm[x.file]||{}).enabled!==false&&((pm[x.file]||{}).showcaseKind||'preset')!=='fixed');
 const bannerIds=[...new Set(bannerWorks.map(x=>x.category))];
 const fourCutId=works.find(x=>layout(catById.get(x.category))==='four-cut')?.category||'';
 return {
  hasPreset:settings.presetEnabled!==false&&settings.showcasePresetEnabled!==false&&presetItems.length>0,
  hasBanner:bannerWorks.length>0,
  bannerIds,
  fourCutId
 }
}
function send(target){
 if(ch)ch.postMessage({type:'navigate',target});
 try{for(let i=0;i<window.top.length;i++)try{window.top.frames[i].postMessage({type:'artmug-section-nav',target},'*')}catch{}}catch{}
 try{window.parent.postMessage({type:'artmug-section-nav',target},'*')}catch{}
 root.querySelectorAll('button').forEach(b=>b.classList.toggle('is-active',b.dataset.target===target))
}
function listFrom(d){
 currentSummary=d||{};
 const list=[{label:'공지사항',target:'notice'}];
 if(d.hasPreset)list.push({label:'미판매 프리셋',target:'showcase'});
 if(d.hasBanner)list.push({label:'SOOP 배너',target:'banner:all'});
 if(d.fourCutId)list.push({label:'인생네컷',target:'portfolio:'+d.fourCutId});
 list.push({divider:true},{label:'문의 양식',target:'inquiry',cls:'inquiry-button'},{label:'TOP ↑',target:'top',cls:'top-button'});
 return list
}
function normalizeActiveTarget(target){
 target=String(target||'');
 if(target.startsWith('showcase-'))return'showcase';
 if(target==='banner:A'||target==='banner:B'||target==='banner:all')return'banner:all';
 if(target.startsWith('portfolio:')){
  const id=target.split(':')[1];
  if((currentSummary.bannerIds||[]).includes(id))return'banner:all'
 }
 return target
}
function show(items){
 root.innerHTML=items.map(x=>x.divider?'<div class="divider" aria-hidden="true"></div>':'<button type="button" class="'+(x.cls||'')+'" data-target="'+x.target+'">'+x.label+'</button>').join('');
 root.querySelectorAll('[data-target]').forEach(b=>b.addEventListener('click',()=>send(b.dataset.target)))
}
function cached(){try{const x=JSON.parse(sessionStorage.getItem(CACHE_KEY)||'null');return x&&Date.now()-x.time<60000?x.data:null}catch{return null}}
function saveCache(data){try{sessionStorage.setItem(CACHE_KEY,JSON.stringify({time:Date.now(),data}))}catch{}}
async function init(){
 const old=cached();if(old)show(listFrom(old));
 try{
  const [d,index,presets]=await Promise.all([api('/api/public/settings?fresh='+Date.now()),raw('portfolio/index.json'),raw('site/data/presets.json')]);
  const summary=summarize(d.settings||{},index,presets);saveCache(summary);show(listFrom(summary))
 }catch{if(!old)show([{label:'공지사항',target:'notice'},{divider:true},{label:'문의 양식',target:'inquiry',cls:'inquiry-button'},{label:'TOP ↑',target:'top',cls:'top-button'}])}
}
if(ch)ch.addEventListener('message',e=>{
 const d=e.data;
 if(d?.type==='nav-data'){
  const cats=Array.isArray(d.categories)?d.categories:[];
  const summary={
   hasPreset:!!d.preset,
   hasBanner:cats.some(c=>c.banner),
   bannerIds:cats.filter(c=>c.banner).map(c=>c.id),
   fourCutId:cats.find(c=>c.kind==='four-cut')?.id||''
  };
  saveCache(summary);show(listFrom(summary));return
 }
 if(d?.type==='active'){
  const target=normalizeActiveTarget(d.target);
  root.querySelectorAll('button').forEach(b=>b.classList.toggle('is-active',b.dataset.target===target))
 }
});
window.addEventListener('message',e=>{
 const d=e.data;
 if(d&&d.type==='artmug-active-section'&&d.target){
  const target=normalizeActiveTarget(d.target);
  root.querySelectorAll('button').forEach(b=>b.classList.toggle('is-active',b.dataset.target===target))
 }
});
init()
})();;;
</script></body></html>
