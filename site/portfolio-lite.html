function setupLazy(){const imgs=[...document.querySelectorAll('img[data-file]')];document.querySelectorAll('.retry').forEach(b=>b.onclick=()=>{const img=b.parentElement.querySelector('img');if(img){img.dataset.loaded='0';img.dataset.queued='0';enqueue(img)}});if('IntersectionObserver'in window){observer=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){observer.unobserve(e.target);enqueue(e.target)}}),{rootMargin:'80px 0px'});imgs.forEach(img=>observer.observe(img))}else imgs.forEach(enqueue)}
async function refresh(){const btn=document.getElementById('refresh'),status=document.getElementById('status');btn.disabled=true;status.textContent='최신 목록 확인 중…';try{const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),9000),r=await fetch(INDEX,{cache:'no-cache',signal:ctrl.signal});clearTimeout(timer);if(!r.ok)throw new Error('HTTP '+r.status);const fresh=await r.json();const oldByFile=new Map(SNAPSHOT.items.map(x=>[x.f,x]));const allowed=new Set(SNAPSHOT.cats.map(c=>c.id)),hidden=new Set(SNAPSHOT.hidden||[]);const next=(Array.isArray(fresh)?fresh:[]).map(x=>({c:logical(x.category),f:x.file,a:x.alt||x.originalName||'',t:String(x.createdAt||'')})).filter(x=>x.f&&allowed.has(x.c)&&!hidden.has(x.f));const pos=new Map(SNAPSHOT.order.map((f,i)=>[f,i]));next.sort((a,b)=>{const ap=pos.has(a.f)?pos.get(a.f):Number.MAX_SAFE_INTEGER,bp=pos.has(b.f)?pos.get(b.f):Number.MAX_SAFE_INTEGER;if(ap!==bp)return ap-bp;return String(b.t).localeCompare(String(a.t))});if(next.length){const before=items.map(x=>x.f).join('|'),after=next.map(x=>x.f).join('|');items=next;if(before!==after)render()}status.textContent=items.length+'개 작업물 · 최신 목록'}catch{status.textContent=items.length+'개 작업물 · 저장된 목록으로 표시 중'}finally{btn.disabled=false}}
document.getElementById('refresh').onclick=refresh;render();const conn=navigator.connection||navigator.mozConnection||navigator.webkitConnection;const slow=!!(conn?.saveData||/^(?:slow-)?2g$|^3g$/i.test(String(conn?.effectiveType||'')));if(!slow)setTimeout(()=>refresh(),1800);
})();
