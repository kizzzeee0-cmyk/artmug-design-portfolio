<!doctype html><html lang="ko" class="public-page"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><meta name="theme-color" content="#9389de"><title>칠공 문의양식</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/subsets/Paperlogy-dynamic-subset.css"><link rel="stylesheet" href="/css/style.css?v=20261004-0610"></head><body class="artmug-part artmug-part-inquiry"><main class="site-shell"><section class="author-intro" id="authorIntro" hidden><img id="authorImage" alt="작가 소개 이미지"><p id="authorText" class="preline"></p></section>
<section class="notice-stack"><article class="card info-card schedule-card"><span class="section-kicker">SCHEDULE</span><h2 id="scheduleTitle">작업 일정 안내</h2><p id="scheduleText" class="preline"></p></article><article class="card info-card notice-card"><div class="notice-heading"><div><span class="section-kicker">NOTICE</span><h2 id="noticeTitle">공지사항</h2><p id="noticeText" class="preline muted"></p></div></div><div id="noticeItems" class="notice-list"></div></article></section>
<section class="events-section" id="eventsSection" hidden>
  <div class="event-content">
    <div class="event-badge"><span class="event-badge-dot"></span><span id="eventsKicker">REVIEW EVENT</span></div>
    <h2 id="eventsTitle"></h2>
    <p id="eventsText" class="preline"></p>
  </div>
  <aside class="event-offer" id="eventOffer" hidden>
    <span class="event-offer-label" id="eventOfferLabel">리뷰 작성 시</span>
    <strong class="event-discount" id="eventDiscount"></strong>
    <div class="event-price-row"><del id="eventOldPrice"></del><span class="event-price-arrow">→</span><b id="eventNewPrice"></b></div>
  </aside>
</section>
<section class="card form-card"><div class="section-heading"><div><span class="section-kicker">INQUIRY</span><h2 id="formTitle">문의양식</h2></div><p id="formDescription" class="muted"></p></div><div class="contact-form">
<label class="span-2 inquiry-nickname-field"><span class="field-label-row"><span id="nicknameLabel"></span><small class="required-badge">필수</small></span><input id="nicknameInput" type="text" aria-required="true"></label>
<div id="requestsContainer" class="span-2 request-list"></div>
<div id="requestAddRow" class="span-2 request-add-row" hidden><button id="addRequestButton" class="request-add-button" type="button"><span class="request-add-icon">+</span><span>신청 항목 추가</span></button></div>
<div class="span-2 form-actions"><div class="form-action-buttons"><button id="copyButton" class="primary-button" type="button"></button></div><span id="copyStatus" class="status-text"></span></div>
</div></section>
<section class="card portfolio-card" id="portfolioSection"><div class="portfolio-header"><div><span class="section-kicker">PORTFOLIO</span><h2 id="portfolioTitle">포트폴리오</h2></div><div id="portfolioTabs" class="tabs"></div></div><div id="portfolioStatus" class="portfolio-status"></div><div id="portfolioGrid" class="portfolio-grid"></div><nav id="pagination" class="pagination"></nav></section>
<section class="card preset-section" id="presetSection" hidden>
  <div class="portfolio-header"><div><span class="section-kicker">PRESET</span><h2 id="presetTitle">고정틀 프리셋</h2></div></div>
  <p id="presetNotice" class="preset-notice preline"></p>
  <div id="presetTabs" class="tabs preset-level-tabs"></div>
  <div id="presetStatus" class="portfolio-status"></div>
  <div id="presetGrid" class="portfolio-grid preset-grid"></div>
  <nav id="presetPagination" class="pagination"></nav>
</section>
<footer id="footerText" class="footer muted"></footer></main><dialog id="lightbox" class="lightbox"><button id="lightboxClose" class="lightbox-close">×</button><img id="lightboxImage" alt="확대 이미지" draggable="false"></dialog><script src="/js/config.js"></script><script src="/js/app.js?v=20261004-0610"></script></body></html>
