<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>빠른 이동</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;font-family:"Paperlogy",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;color:#344651;overflow-x:hidden}
body{display:flex;align-items:flex-start;justify-content:flex-start;min-height:100vh}
.quick-nav{position:sticky;top:8px;width:100%;max-width:194px;min-width:0;padding:14px;border:1px solid #d6e9f5;border-radius:28px;background:#fff}
.nav-list{display:grid;gap:7px}
.quick-nav button{display:flex;align-items:center;justify-content:center;width:100%;min-height:40px;padding:10px 9px;border:0;border-radius:999px;background:#edf8fd;color:#407e9f;font:inherit;font-size:12px;font-weight:700;line-height:1.35;text-align:center;cursor:pointer}
.quick-nav button:hover,.quick-nav button:focus-visible{background:#deeffa;color:#2e718f;outline:2px solid transparent}
.quick-nav button.is-active{background:#8fc9e8;color:#fff}
.divider{height:1px;margin:8px 0 5px;background:#dcecf4}
.quick-nav .inquiry-button{background:#8fc9e8;color:#fff;font-weight:800}
.quick-nav .inquiry-button:hover,.quick-nav .inquiry-button:focus-visible{background:#69add2;color:#fff}
.quick-nav .top-button{min-height:34px;background:transparent;color:#619fc4;font-size:12px}
.quick-nav .top-button:hover{background:#edf8fd}
.loading{padding:12px;text-align:center;color:#71818c;font-size:11px}
@media(max-width:165px){.quick-nav{padding:9px;border-radius:22px}.quick-nav button{font-size:10.5px;min-height:36px}}
</style></head>
<body>
<nav class="quick-nav" aria-label="페이지 빠른 이동">
 <div id="navList" class="nav-list"><div class="loading">메뉴 불러오는 중…</div></div>
</nav>
<script src="/js/config.js"></script>
<script>
(function(){
const API=(window.ARTMUG_CONFIG||{}).API_BASE||'',root=document.getElementById('navList');
const ch=('BroadcastChannel' in window)?new BroadcastChannel('artmug-portfolio-section-nav'):null;
const api=async p=>{const r=await fetch(API+p,{credentials:'include'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()};
const layout=c=>{
 const id=String(c.id||''),label=String(c.label||'').replace(/\s/g,'');
 if(id==='top-banner'||label.includes('상단배너'))return'top-banner';
 if(id==='floating-banner'||label.includes('플로팅'))return'floating-banner';
 if(id==='bottom-banner'||label.includes('하단배너일반'))return'bottom-banner';
 if(id==='bottom-split'||label.includes('하단배너분할'))return'bottom-split';
 if(/4cut|four-cut/.test(id)||label.includes('인생네컷'))return'four-cut';
 return id;
};
const bannerKinds=new Set(['top-banner','floating-banner','bottom-banner','bottom-split']);
function send(target){
 if(ch)ch.postMessage({type:'navigate',target});
 try{for(let i=0;i<window.top.length;i++)try{window.top.frames[i].postMessage({type:'artmug-section-nav',target},'*')}catch{}}catch{}
 try{window.parent.postMessage({type:'artmug-section-nav',target},'*')}catch{}
 root.querySelectorAll('button').forEach(b=>b.classList.toggle('is-active',b.dataset.target===target))
}
function show(items){
 root.innerHTML=items.map(x=>x.divider?'<div class="divider" aria-hidden="true"></div>':'<button type="button" class="'+(x.cls||'')+'" data-target="'+x.target+'">'+x.label+'</button>').join('');
 root.querySelectorAll('[data-target]').forEach(b=>b.addEventListener('click',()=>send(b.dataset.target)))
}
async function all(cat){
 let url='/api/public/portfolio?category='+encodeURIComponent(cat)+'&page=1&perPage=60';
 const first=await api(url),arr=[...(first.items||[])];
 for(let p=2;p<=Number(first.totalPages||1);p++){
  const next=await api('/api/public/portfolio?category='+encodeURIComponent(cat)+'&page='+p+'&perPage=60');
  arr.push(...(next.items||[]))
 }
 return arr
}
async function init(){
 const d=await api('/api/public/settings?fresh='+Date.now()),s=d.settings||{},m=s.portfolioMeta||{};
 const cats=(s.portfolioCategories||[]).filter(c=>c.enabled!==false&&!c.hiddenLegacy);
 const bannerItems=[],four=[];
 for(const c of cats){
  const k=layout(c);
  if(!bannerKinds.has(k)&&k!=='four-cut')continue;
  const arr=(await all(c.id).catch(()=>[])).filter(x=>(m[x.file]||{}).enabled!==false);
  if(k==='four-cut')four.push({id:c.id,items:arr});
  else bannerItems.push(...arr)
 }
 const hasA=bannerItems.some(x=>(m[x.file]||{}).isFixed!==true&&((m[x.file]||{}).bannerType||'B')==='A');
 const hasB=bannerItems.some(x=>(m[x.file]||{}).isFixed!==true&&((m[x.file]||{}).bannerType||'B')==='B');
 const hasFour=four.find(x=>x.items.length);
 const list=[{label:'공지사항',target:'notice'}];
 if(s.presetEnabled!==false&&s.showcasePresetEnabled!==false)list.push({label:'미판매 프리셋',target:'showcase-preset'});
 if(s.presetEnabled!==false&&s.showcaseFixedEnabled!==false)list.push({label:'고정틀',target:'showcase-fixed'});
 if(hasA)list.push({label:'배너 TYPE A',target:'banner:A'});
 if(hasB)list.push({label:'배너 TYPE B',target:'banner:B'});
 if(hasFour)list.push({label:'인생네컷',target:'portfolio:'+hasFour.id});
 list.push({divider:true},{label:'문의 양식',target:'inquiry',cls:'inquiry-button'},{label:'TOP ↑',target:'top',cls:'top-button'});
 show(list)
}
if(ch)ch.addEventListener('message',e=>{
 const d=e.data;if(d?.type==='active')root.querySelectorAll('button').forEach(b=>b.classList.toggle('is-active',b.dataset.target===d.target))
});
init().catch(()=>show([{label:'공지사항',target:'notice'},{label:'미판매 프리셋',target:'showcase-preset'},{label:'고정틀',target:'showcase-fixed'},{divider:true},{label:'문의 양식',target:'inquiry',cls:'inquiry-button'},{label:'TOP ↑',target:'top',cls:'top-button'}]));
})();
</script></body></html>
