<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>빠른 이동</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/subsets/Paperlogy-dynamic-subset.css">
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  background:transparent;
  font-family:"Paperlogy",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
  color:#3d6581
}
body{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:26px 6px 20px;
  overflow:visible
}
.quick-shell{
  position:relative;
  width:min(188px,calc(100% - 4px));
  min-width:0;
  padding:25px 13px 15px;
  border:1.5px solid #b9dcf3;
  border-radius:31px;
  background:linear-gradient(180deg,#ffffff 0%,#fcfeff 58%,#fafdff 100%);
  box-shadow:
    0 10px 28px rgba(94,161,202,.12),
    0 2px 8px rgba(112,181,221,.08),
    inset 0 0 0 1px rgba(255,255,255,.78);
  overflow:visible
}

/* status speech bubble */
.quick-work-status{
  position:absolute;
  top:-16px;
  right:-2px;
  z-index:3;
  margin:0
}
.quick-work-status[hidden]{display:none!important}
.quick-work-status-badge{
  position:relative;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  min-height:30px;
  padding:6px 11px 6px 9px;
  border:1.5px solid #b9dcf3;
  border-radius:999px;
  background:#fff;
  color:#4f84aa;
  font-size:10px;
  font-weight:750;
  line-height:1;
  white-space:nowrap;
  box-shadow:0 5px 13px rgba(89,159,203,.12)
}
.quick-work-status-badge::after{
  content:"";
  position:absolute;
  right:16px;
  bottom:-5px;
  width:9px;
  height:9px;
  border-right:1.5px solid #b9dcf3;
  border-bottom:1.5px solid #b9dcf3;
  background:#fff;
  transform:rotate(45deg);
  border-bottom-right-radius:2px
}
.quick-work-status-dot{
  width:8px;
  height:8px;
  flex:0 0 8px;
  border-radius:50%;
  background:linear-gradient(135deg,#8adf9d,#49bd72);
  box-shadow:0 1px 3px rgba(60,162,93,.24)
}
.quick-status-rays{
  position:absolute;
  top:-7px;
  right:-10px;
  width:19px;
  height:18px;
  pointer-events:none
}
.quick-status-rays i{
  position:absolute;
  display:block;
  width:4px;
  height:10px;
  border-radius:999px;
  background:#8fcaf0
}
.quick-status-rays i:first-child{top:0;left:4px;transform:rotate(18deg)}
.quick-status-rays i:last-child{top:7px;right:0;transform:rotate(49deg)}

/* title */
.quick-title-wrap{
  display:grid;
  justify-items:center;
  gap:2px;
  margin-top:1px
}
.quick-title-heart{
  color:#5db4ec;
  font-size:13px;
  line-height:1;
  filter:drop-shadow(0 2px 3px rgba(95,175,228,.15))
}
.quick-menu-title{
  margin:0;
  font-size:28px;
  font-weight:900;
  line-height:1;
  letter-spacing:.015em;
  text-align:center;
  background:linear-gradient(180deg,#73c3f3 5%,#3b8fd1 92%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  -webkit-text-stroke:.45px rgba(255,255,255,.85);
  filter:drop-shadow(0 2px 3px rgba(72,148,203,.16))
}
.quick-title-sparkles{
  position:relative;
  width:100%;
  height:7px;
  pointer-events:none
}
.quick-title-sparkles::before,
.quick-title-sparkles::after{
  content:"✦";
  position:absolute;
  top:-2px;
  color:#ffd778;
  font-size:8px;
  line-height:1
}
.quick-title-sparkles::before{left:34px}
.quick-title-sparkles::after{right:34px}
.quick-title-divider{
  position:relative;
  width:100%;
  height:20px;
  margin:4px 0 10px
}
.quick-title-divider::before{
  content:"";
  position:absolute;
  left:7px;
  right:7px;
  top:9px;
  border-top:2px dashed #abd8f3
}
.quick-title-divider::after{
  content:"♥";
  position:absolute;
  top:2px;
  right:3px;
  padding-left:5px;
  background:#fff;
  color:#8fcaf0;
  font-size:9px;
  line-height:1
}
.quick-divider-dot{
  position:absolute;
  top:6px;
  left:1px;
  width:6px;
  height:6px;
  border-radius:50%;
  background:#a8d7f3
}
.quick-bow{
  position:absolute;
  top:3px;
  left:50%;
  width:22px;
  height:14px;
  transform:translateX(-50%);
  background:#fff
}
.quick-bow::before,
.quick-bow::after{
  content:"";
  position:absolute;
  top:2px;
  width:9px;
  height:7px;
  border:2px solid #94cbef
}
.quick-bow::before{
  left:0;
  border-radius:8px 5px 8px 4px;
  transform:rotate(20deg)
}
.quick-bow::after{
  right:0;
  border-radius:5px 8px 4px 8px;
  transform:rotate(-20deg)
}
.quick-bow-center{
  position:absolute;
  left:50%;
  top:5px;
  width:5px;
  height:5px;
  border-radius:50%;
  background:#94cbef;
  transform:translate(-50%,-50%)
}
.quick-bow-tail{
  position:absolute;
  left:50%;
  top:8px;
  width:2px;
  height:7px;
  background:#94cbef;
  transform-origin:top center
}
.quick-bow-tail.is-left{transform:translateX(-2px) rotate(34deg)}
.quick-bow-tail.is-right{transform:translateX(1px) rotate(-34deg)}

/* buttons */
.nav-list{
  display:grid;
  gap:10px
}
.quick-nav-button,
.quick-inquiry-button{
  appearance:none;
  width:100%;
  min-height:48px;
  display:grid;
  grid-template-columns:34px minmax(0,1fr) 34px;
  align-items:center;
  gap:0;
  padding:5px 7px;
  border-radius:999px;
  font:inherit;
  cursor:pointer;
  transition:transform .14s ease,background .14s ease,border-color .14s ease,box-shadow .14s ease
}
.quick-nav-button::before,
.quick-inquiry-button::before{
  content:"";
  width:34px;
  height:1px
}
.quick-nav-button{
  border:1.5px solid #c0e0f4;
  background:linear-gradient(180deg,#fff 0%,#f5fbff 100%);
  color:#47789c;
  box-shadow:0 4px 11px rgba(100,169,211,.08)
}
.quick-nav-button:hover,
.quick-nav-button:focus-visible,
.quick-nav-button.is-active{
  background:linear-gradient(180deg,#f6fbff 0%,#eaf7ff 100%);
  border-color:#8fc9ed;
  box-shadow:0 5px 13px rgba(88,163,210,.12);
  outline:none
}
.quick-nav-button:hover,
.quick-inquiry-button:hover{transform:translateY(-1px)}
.quick-nav-label{
  min-width:0;
  grid-column:2;
  text-align:center;
  white-space:nowrap;
  font-size:12px;
  font-weight:750;
  line-height:1.2
}
.quick-button-arrow{
  grid-column:3;
  width:31px;
  height:31px;
  display:grid;
  place-items:center;
  justify-self:end;
  border-radius:50%;
  background:rgba(255,255,255,.84);
  color:#67b8e9;
  font-size:24px;
  font-weight:500;
  line-height:1;
  box-shadow:inset 0 0 0 1px rgba(197,226,244,.48)
}
.quick-button-arrow span{
  display:block;
  transform:translate(1px,-1px)
}

/* cute separator before inquiry */
.quick-cute-divider{
  position:relative;
  height:23px;
  margin:7px 0 8px
}
.quick-cute-divider::before{
  content:"";
  position:absolute;
  left:6px;
  right:6px;
  top:11px;
  border-top:2px dashed #acd9f4
}
.quick-cute-divider::after{
  content:"♥";
  position:absolute;
  left:50%;
  top:3px;
  padding:0 7px;
  transform:translateX(-50%);
  background:#fff;
  color:#68b9ea;
  font-size:11px;
  line-height:1
}
.quick-cute-divider span::before,
.quick-cute-divider span::after{
  content:"";
  position:absolute;
  top:8px;
  width:5px;
  height:5px;
  border-radius:50%;
  background:#abd9f4
}
.quick-cute-divider span::before{left:1px}
.quick-cute-divider span::after{right:1px}

.quick-inquiry-button{
  border:1.5px solid #73bee9;
  background:linear-gradient(180deg,#7dcbf5 0%,#65b7eb 100%);
  color:#fff;
  box-shadow:0 7px 15px rgba(77,160,214,.17)
}
.quick-inquiry-button:hover,
.quick-inquiry-button:focus-visible,
.quick-inquiry-button.is-active{
  background:linear-gradient(180deg,#73c6f4 0%,#55ade5 100%);
  border-color:#62b5e5;
  outline:none
}
.quick-inquiry-button .quick-nav-label{
  color:#fff;
  font-weight:800;
  text-shadow:0 1px 2px rgba(49,126,178,.16)
}
.quick-inquiry-button .quick-button-arrow{
  background:rgba(255,255,255,.28);
  color:#fff;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)
}

/* TOP */
.quick-top-wrap{
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:63px;
  margin-top:7px
}
.quick-top-button{
  position:relative;
  width:54px;
  height:54px;
  display:grid;
  place-items:center;
  padding:0;
  border:1.5px solid #b8daf0;
  border-radius:50%;
  background:linear-gradient(180deg,#fff 0%,#f8fcff 100%);
  color:#65b5e7;
  font:inherit;
  cursor:pointer;
  box-shadow:0 5px 13px rgba(92,161,205,.11);
  transition:transform .14s ease,background .14s ease,border-color .14s ease
}
.quick-top-button:hover,
.quick-top-button:focus-visible{
  transform:translateY(-1px);
  background:#f3faff;
  border-color:#91c9ea;
  outline:none
}
.quick-top-content{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  line-height:1
}
.quick-top-arrow{
  display:block;
  width:12px;
  height:8px
}
.quick-top-arrow svg{
  display:block;
  width:100%;
  height:100%;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round
}
.quick-top-text{
  display:block;
  font-size:9px;
  font-weight:850;
  line-height:1
}
.quick-top-spark{
  position:absolute;
  color:#ffd56d;
  font-size:9px;
  line-height:1
}
.quick-top-spark.is-left{left:24px;bottom:19px}
.quick-top-spark.is-right{right:24px;bottom:19px}
.quick-top-ray{
  position:absolute;
  width:3px;
  height:8px;
  border-radius:999px;
  background:#9acff0
}
.quick-top-ray.is-left{left:38px;top:7px;transform:rotate(-45deg)}
.quick-top-ray.is-right{right:38px;top:7px;transform:rotate(45deg)}

/* compact-but-safe desktop heights */
@media(max-height:720px){
  body{
    align-items:flex-start;
    padding-top:24px;
    padding-bottom:12px
  }
  .quick-shell{
    padding-top:21px;
    padding-bottom:12px
  }
  .quick-menu-title{font-size:25px}
  .quick-title-divider{margin-bottom:7px}
  .quick-nav-button,
  .quick-inquiry-button{min-height:43px}
  .quick-cute-divider{height:19px;margin:5px 0 6px}
  .quick-top-wrap{min-height:54px;margin-top:4px}
  .quick-top-button{width:48px;height:48px}
}
@media(max-height:560px){
  body{padding-top:20px}
  .quick-shell{padding-top:19px}
  .quick-menu-title{font-size:23px}
  .quick-title-heart{font-size:11px}
  .quick-title-divider{height:17px;margin-top:2px;margin-bottom:5px}
  .nav-list{gap:7px}
  .quick-nav-button,
  .quick-inquiry-button{min-height:39px}
  .quick-nav-label{font-size:11px}
  .quick-button-arrow{width:27px;height:27px;font-size:21px}
  .quick-cute-divider{height:17px;margin:4px 0 5px}
  .quick-top-wrap{min-height:48px}
  .quick-top-button{width:44px;height:44px}
}
@media(max-width:150px){
  .quick-shell{padding-left:9px;padding-right:9px}
  .quick-nav-button,
  .quick-inquiry-button{
    grid-template-columns:28px minmax(0,1fr) 28px;
    padding-left:4px;
    padding-right:4px
  }
  .quick-nav-button::before,
  .quick-inquiry-button::before{width:28px}
  .quick-button-arrow{width:27px;height:27px}
  .quick-nav-label{font-size:10.5px}
}
</style>
</head>
<body>
<nav class="quick-shell" aria-label="페이지 빠른 이동">
  <div id="quickWorkStatus" class="quick-work-status" hidden aria-live="polite">
    <div class="quick-work-status-badge">
      <span class="quick-work-status-dot" aria-hidden="true"></span>
      <span id="quickWorkStatusLabel"></span>
    </div>
    <span class="quick-status-rays" aria-hidden="true"><i></i><i></i></span>
  </div>

  <div class="quick-title-wrap" aria-hidden="true">
    <span class="quick-title-heart">♥</span>
    <div class="quick-menu-title">MENU</div>
    <div class="quick-title-sparkles"></div>
  </div>

  <div class="quick-title-divider" aria-hidden="true">
    <span class="quick-divider-dot"></span>
    <span class="quick-bow">
      <span class="quick-bow-center"></span>
      <span class="quick-bow-tail is-left"></span>
      <span class="quick-bow-tail is-right"></span>
    </span>
  </div>

  <div class="nav-list">
    <button type="button" class="quick-nav-button" data-target="notice">
      <span class="quick-nav-label">공지사항</span>
      <span class="quick-button-arrow" aria-hidden="true"><span>›</span></span>
    </button>
    <button type="button" class="quick-nav-button" data-target="fixed">
      <span class="quick-nav-label">고정틀</span>
      <span class="quick-button-arrow" aria-hidden="true"><span>›</span></span>
    </button>
  </div>

  <div class="quick-cute-divider" aria-hidden="true"><span></span></div>

  <button type="button" class="quick-inquiry-button" data-target="inquiry">
    <span class="quick-nav-label">문의양식</span>
    <span class="quick-button-arrow" aria-hidden="true"><span>›</span></span>
  </button>

  <div class="quick-top-wrap">
    <span class="quick-top-ray is-left" aria-hidden="true"></span>
    <span class="quick-top-ray is-right" aria-hidden="true"></span>
    <span class="quick-top-spark is-left" aria-hidden="true">✦</span>
    <button id="quickTopButton" type="button" class="quick-top-button" data-target="top" aria-label="페이지 상단으로 이동">
      <span class="quick-top-content">
        <span class="quick-top-arrow" aria-hidden="true"><svg viewBox="0 0 12 8"><path d="M1 6 6 1l5 5"/></svg></span>
        <span class="quick-top-text">TOP</span>
      </span>
    </button>
    <span class="quick-top-spark is-right" aria-hidden="true">✦</span>
  </div>
</nav>

<script src="/js/config.js"></script>
<script>
(function(){
const API=(window.ARTMUG_CONFIG||{}).API_BASE||'';
const ch=('BroadcastChannel' in window)?new BroadcastChannel('artmug-portfolio-section-nav'):null;

function send(target){
 if(ch)ch.postMessage({type:'navigate',target});
 try{
  for(let i=0;i<window.top.length;i++){
   try{window.top.frames[i].postMessage({type:'artmug-section-nav',target},'*')}catch{}
  }
 }catch{}
 try{window.parent.postMessage({type:'artmug-section-nav',target},'*')}catch{}
 setActiveTarget(target)
}
function normalizeActiveTarget(target){
 target=String(target||'');
 if(target.startsWith('showcase-'))return'';
 if(target==='notice'||target==='fixed'||target==='inquiry')return target;
 return''
}
function setActiveTarget(target){
 const normalized=normalizeActiveTarget(target);
 document.querySelectorAll('[data-target="notice"],[data-target="fixed"],[data-target="inquiry"]').forEach(b=>{
  b.classList.toggle('is-active',!!normalized&&b.dataset.target===normalized)
 })
}
function renderWorkStatus(status){
 const box=document.getElementById('quickWorkStatus');
 if(!box)return;
 const enabled=status?.enabled===true;
 box.hidden=!enabled;
 if(!enabled)return;
 const mode=status?.mode==='sleeping'?'sleeping':'working';
 box.dataset.status=mode;
 const label=document.getElementById('quickWorkStatusLabel');
 if(label)label.textContent=mode==='sleeping'?'취침중':'작업중'
}
async function loadStatus(){
 try{
  const r=await fetch(API+'/api/public/nav-summary',{credentials:'include'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const d=await r.json();
  renderWorkStatus(d?.workStatus)
 }catch{
  renderWorkStatus({enabled:false,mode:'working'})
 }
}
document.querySelectorAll('[data-target="notice"],[data-target="fixed"],[data-target="inquiry"]').forEach(b=>{
 b.addEventListener('click',()=>send(b.dataset.target))
});
document.getElementById('quickTopButton')?.addEventListener('click',()=>send('top'));

if(ch)ch.addEventListener('message',e=>{
 const d=e.data;
 if(d?.type==='work-status'){
  renderWorkStatus({enabled:d.enabled===true,mode:d.mode==='sleeping'?'sleeping':'working'});
  return
 }
 if(d?.type==='active')setActiveTarget(d.target)
});
window.addEventListener('message',e=>{
 const d=e.data;
 if(d?.type==='artmug-active-section'&&d.target)setActiveTarget(d.target)
});
loadStatus()
})();
</script>
</body>
</html>
