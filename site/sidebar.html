<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>빠른 이동</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/subsets/Paperlogy-dynamic-subset.css">
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  background:transparent;
  font-family:"Paperlogy",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
  color:#4d6d83
}
body{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:34px 6px 18px;
  overflow:visible
}
.quick-shell{
  position:relative;
  width:min(208px,calc(100% - 2px));
  padding:36px 0 4px;
  background:transparent
}
.quick-shell::before{
  content:"";
  position:absolute;
  left:24px;
  top:42px;
  bottom:25px;
  width:1.5px;
  border-radius:999px;
  background:#a9d6ef;
  z-index:0
}

/* 상태 배지 */
.quick-work-status{
  position:absolute;
  top:0;
  right:2px;
  z-index:4
}
.quick-work-status[hidden]{display:none!important}
.quick-work-status-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:25px;
  padding:5px 9px;
  border:1px solid #cfe3ef;
  border-radius:999px;
  background:#f9fcfe;
  color:#638094;
  font-size:9.5px;
  font-weight:700;
  line-height:1;
  white-space:nowrap;
  box-shadow:0 4px 12px rgba(88,157,198,.08)
}
.quick-work-status-dot{
  width:7px;
  height:7px;
  flex:0 0 7px;
  border-radius:50%;
  background:#84cbed
}
.quick-work-status[data-status="sleeping"] .quick-work-status-dot{background:#9fb5c2}
.quick-work-status[data-status="sleeping"] .quick-work-status-badge{
  background:#f7fafc;
  color:#6f818c
}

/* 메뉴 */
.nav-list{
  position:relative;
  z-index:1;
  display:grid;
  gap:7px
}
.quick-nav-button,
.quick-inquiry-button{
  appearance:none;
  width:100%;
  min-height:46px;
  display:grid;
  grid-template-columns:48px minmax(0,1fr);
  align-items:center;
  gap:5px;
  padding:4px 10px 4px 0;
  border:1px solid transparent;
  border-radius:999px;
  background:transparent;
  color:#55758b;
  font:inherit;
  cursor:pointer;
  text-align:left;
  transition:background .14s ease,border-color .14s ease,color .14s ease,box-shadow .14s ease,transform .14s ease
}
.quick-nav-button:hover,
.quick-nav-button:focus-visible{
  background:#f5fbfe;
  outline:none
}
.quick-nav-button.is-active{
  border-color:#8fc8e8;
  background:#a9d9f4;
  color:#fff;
  box-shadow:0 5px 14px rgba(92,166,210,.13)
}
.quick-nav-icon{
  position:relative;
  z-index:2;
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  justify-self:center;
  border:1px solid #e3eef4;
  border-radius:50%;
  background:#fff;
  color:#5f96bc;
  box-shadow:0 5px 13px rgba(85,139,174,.08)
}
.quick-nav-icon svg{
  width:20px;
  height:20px;
  display:block;
  fill:none;
  stroke:currentColor;
  stroke-width:1.75;
  stroke-linecap:round;
  stroke-linejoin:round
}
.quick-nav-button.is-active .quick-nav-icon{
  border-color:rgba(255,255,255,.48);
  background:rgba(255,255,255,.92);
  color:#5fa8d5;
  box-shadow:none
}
.quick-nav-label{
  min-width:0;
  padding-right:5px;
  color:inherit;
  font-size:12.5px;
  font-weight:700;
  line-height:1.2;
  white-space:nowrap;
  word-break:keep-all
}

/* 문의 CTA */
.quick-inquiry-section{
  position:relative;
  z-index:2;
  margin-top:8px
}
.quick-inquiry-section[hidden]{display:none!important}
.quick-inquiry-button{
  min-height:48px;
  border-color:#7fc4e9;
  background:#85c9ef;
  color:#fff;
  box-shadow:0 6px 15px rgba(75,157,208,.15)
}
.quick-inquiry-button:hover,
.quick-inquiry-button:focus-visible,
.quick-inquiry-button.is-active{
  border-color:#6bb7e0;
  background:#73bee8;
  color:#fff;
  outline:none
}
.quick-inquiry-button .quick-nav-icon{
  border-color:rgba(255,255,255,.55);
  background:#fff;
  color:#5898c1;
  box-shadow:none
}
.quick-inquiry-button .quick-nav-label{
  color:#fff;
  font-weight:800
}

/* TOP */
.quick-top-wrap{
  position:relative;
  z-index:2;
  min-height:51px;
  display:flex;
  align-items:flex-end;
  justify-content:flex-start;
  padding-left:3px;
  margin-top:6px
}
.quick-top-button{
  position:relative;
  width:43px;
  height:43px;
  display:grid;
  place-items:center;
  padding:0;
  border:1px solid #cfe4f0;
  border-radius:50%;
  background:#fff;
  color:#77b9dd;
  font:inherit;
  cursor:pointer;
  box-shadow:0 5px 13px rgba(87,146,181,.08)
}
.quick-top-button:hover,
.quick-top-button:focus-visible{
  border-color:#a8d3e9;
  background:#f7fbfe;
  outline:none
}
.quick-top-content{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  line-height:1
}
.quick-top-arrow{
  width:10px;
  height:6px
}
.quick-top-arrow svg{
  width:100%;
  height:100%;
  display:block;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round
}
.quick-top-text{
  font-size:7.5px;
  font-weight:800;
  line-height:1
}

.loading{
  padding:10px 6px 10px 54px;
  color:#81949f;
  font-size:10px
}

<script>
(function(){
const API=(window.ARTMUG_CONFIG||{}).API_BASE||'';

const ch=('BroadcastChannel' in window)?new BroadcastChannel('artmug-portfolio-section-nav'):null;
let currentSummary={},liveWorkStatus=null,activeTarget='';

const api=async p=>{

 if(!r.ok)throw new Error('HTTP '+r.status);
 return r.json()
};

function iconSvg(item){
 const t=String(item?.target||'');
 if(t==='notice')return '<svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7"/><path d="M6.5 10.5V20h11v-9.5"/><path d="M9.5 20v-5.5h5V20"/></svg>';
 if(t==='fixed')return '<svg viewBox="0 0 24 24"><path d="M6 3.5h9l3 3V20.5H6z"/><path d="M15 3.5v4h4"/><path d="M9 12h6M9 16h5"/></svg>';
 if(t==='showcase')return '<svg viewBox="0 0 24 24"><path d="M5 7h14M5 17h14"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="17" r="2"/></svg>';
 if(t.startsWith('portfolio:')&&String(item?.label||'').includes('움짤'))return '<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/></svg>';
 if(t==='banner:all')return '<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="m6.5 16 4-4 3 2.5 2.5-3 3.5 4.5"/></svg>';
 if(t.startsWith('portfolio:')&&String(item?.label||'').includes('인생'))return '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>';

}
function send(target){
 if(ch)ch.postMessage({type:'navigate',target});
 try{
  for(let i=0;i<window.top.length;i++){
   try{window.top.frames[i].postMessage({type:'artmug-section-nav',target},'*')}catch{}
  }
 }catch{}
 try{window.parent.postMessage({type:'artmug-section-nav',target},'*')}catch{}
 setActiveTarget(target)
}
function listFrom(d){
 currentSummary=d||{};
 const list=[{label:'공지사항',target:'notice'}];
 if(d.hasFixed)list.push({label:'고정틀',target:'fixed'});
 if(d.hasPreset)list.push({label:'프리셋',target:'showcase'});
 if(d.profile)list.push({label:'움짤프사',target:'portfolio:'+d.profile.id});
 if(d.hasBanner)list.push({label:'SOOP 배너',target:'banner:all'});
 if(d.fourCut)list.push({label:'인생네컷',target:'portfolio:'+d.fourCut.id});
 (Array.isArray(d.extraCategories)?d.extraCategories:[]).forEach(c=>{
  list.push({label:c.label,target:'portfolio:'+c.id})
 });
 return list
}
function normalizeActiveTarget(target){
 target=String(target||'');
 if(target==='preset'||target==='showcase-preset'||target.startsWith('showcase-'))return'showcase';
 if(target==='seasonal-fixed')return'fixed';
 if(target==='banner:A'||target==='banner:B'||target==='banner:all')return'banner:all';
 if(target.startsWith('portfolio:')){
  const id=target.split(':')[1];
  if((currentSummary.bannerIds||[]).includes(id))return'banner:all'
 }
 return target
}
function setActiveTarget(target){
 activeTarget=normalizeActiveTarget(target);
 document.querySelectorAll('.quick-nav-button,[data-target="inquiry"]').forEach(b=>{
  b.classList.toggle('is-active',b.dataset.target===activeTarget)
 })
}
function renderMenu(){
 const items=listFrom(currentSummary);
 root.innerHTML=items.map(item=>
  '<button type="button" class="quick-nav-button '+(item.target===activeTarget?'is-active':'')+'" data-target="'+item.target+'">'+
   '<span class="quick-nav-icon" aria-hidden="true">'+iconSvg(item)+'</span>'+
   '<span class="quick-nav-label">'+item.label+'</span>'+
  '</button>'
 ).join('');
 root.querySelectorAll('.quick-nav-button').forEach(b=>b.addEventListener('click',()=>send(b.dataset.target)));

}
function summaryFromNav(d){
 const cats=Array.isArray(d?.categories)?d.categories:[];
 const nonBanner=cats.filter(c=>!c.banner);
 const profile=nonBanner.find(c=>c.kind==='profile');
 const fourCut=nonBanner.find(c=>c.kind==='four-cut');
 return {
  hasPreset:!!d?.hasPreset,
  hasFixed:!!d?.hasFixed,
  hasBanner:cats.some(c=>c.banner),
  bannerIds:cats.filter(c=>c.banner).map(c=>c.id),
  profile:profile?{id:profile.id,label:'움짤프사'}:null,
  fourCut:fourCut?{id:fourCut.id,label:'인생네컷'}:null,
  extraCategories:nonBanner
   .filter(c=>c.kind!=='profile'&&c.kind!=='four-cut')
   .map(c=>({id:c.id,label:String(c.label||c.id)})),
  workStatus:{
   enabled:d?.workStatus?.enabled===true,
   mode:d?.workStatus?.mode==='sleeping'?'sleeping':'working',
   description:String(d?.workStatus?.description||'')
  }
 }
}
function mergeFrameNavData(d){
 const cats=Array.isArray(d?.categories)?d.categories:[];
 if(!cats.length)return null;
 const frame=summaryFromNav({
  hasPreset:d?.preset===true,
  hasFixed:d?.fixed===true,
  categories:cats,
  workStatus:currentSummary?.workStatus
 });
 const extras=new Map();
 (Array.isArray(currentSummary?.extraCategories)?currentSummary.extraCategories:[]).forEach(x=>extras.set(x.id,x));
 (Array.isArray(frame.extraCategories)?frame.extraCategories:[]).forEach(x=>extras.set(x.id,x));
 return {
  ...currentSummary,
  hasPreset:currentSummary?.hasPreset===true||frame.hasPreset===true,
  hasFixed:currentSummary?.hasFixed===true||frame.hasFixed===true,
  hasBanner:currentSummary?.hasBanner===true||frame.hasBanner===true,
  bannerIds:[...new Set([...(currentSummary?.bannerIds||[]),...(frame.bannerIds||[])])],
  profile:frame.profile||currentSummary?.profile||null,
  fourCut:frame.fourCut||currentSummary?.fourCut||null,
  extraCategories:[...extras.values()],
  workStatus:currentSummary?.workStatus||frame.workStatus
 }
}
function renderWorkStatus(status){

 const enabled=status?.enabled===true;

 if(label)label.textContent=mode==='sleeping'?'취침중':'작업중'

function renderSummary(d){

}

async function init(){
 const old=cached();
 try{
  const d=await api('/api/public/nav-summary');
  const summary=summaryFromNav(d);
  saveCache(summary);
  renderSummary(summary)
 }catch{
  if(old)renderSummary(old);
  else renderSummary({
   hasPreset:false,hasFixed:false,hasBanner:false,bannerIds:[],
   profile:null,fourCut:null,extraCategories:[],
   workStatus:{enabled:false,mode:'working',description:''}
  })
 }
}
document.getElementById('quickInquiryButton')?.addEventListener('click',()=>send('inquiry'));
document.getElementById('quickTopButton')?.addEventListener('click',()=>send('top'));

if(ch)ch.addEventListener('message',e=>{
 const d=e.data;
 if(d?.type==='work-status'){
  liveWorkStatus={
   enabled:d.enabled===true,
   mode:d.mode==='sleeping'?'sleeping':'working',
   description:String(d.description||'')
  };
  renderWorkStatus(liveWorkStatus);
  return
 }
 if(d?.type==='nav-data'){
  const updated=mergeFrameNavData(d);
  if(updated){
   saveCache(updated);
   renderSummary(updated)
  }
  return
 }
 if(d?.type==='active')setActiveTarget(d.target)
});
window.addEventListener('message',e=>{
 const d=e.data;
 if(d?.type==='artmug-active-section'&&d.target)setActiveTarget(d.target)
});
init()
})();
</script>
</body>
</html>
