<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>빠른 이동</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/subsets/Paperlogy-dynamic-subset.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;font-family:"Paperlogy",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;color:#344651;overflow-x:hidden}
body{display:flex;align-items:flex-start;justify-content:flex-start;min-height:100vh}
.quick-nav{position:sticky;top:8px;width:calc(100% - 8px);max-width:194px;min-width:0;margin-left:8px;padding:14px;border:1px solid #d6e9f5;border-radius:28px;background:#fff}
.nav-list{display:grid;gap:7px}
.quick-nav button{display:flex;align-items:center;justify-content:center;width:100%;min-height:40px;padding:10px 9px;border:0;border-radius:999px;background:#edf8fd;color:#8fc9e8;font:inherit;font-size:13px;font-weight:700;line-height:1.35;text-align:center;cursor:pointer}
.quick-nav button:hover,.quick-nav button:focus-visible{background:#deeffa;color:#8fc9e8;outline:2px solid transparent}
.quick-nav button.is-active{background:#8fc9e8;color:#fff}
.divider{height:1px;margin:8px 0 5px;background:#dcecf4}
.quick-nav .inquiry-button{background:#8fc9e8;color:#fff;font-weight:800}
.quick-nav .inquiry-button:hover,.quick-nav .inquiry-button:focus-visible{background:#69add2;color:#fff}
.quick-nav .top-button{min-height:34px;background:transparent;color:#8fc9e8;font-size:13px}
.quick-nav .top-button{gap:4px}
.quick-nav .top-button .top-arrow{display:inline-block;font-size:9px;font-weight:700;line-height:1;transform:translateY(-1px)}
.quick-nav .top-button:hover{background:#edf8fd}
.loading{padding:12px;text-align:center;color:#71818c;font-size:11px}
@media(max-width:165px){.quick-nav{padding:9px;border-radius:22px}.quick-nav button{font-size:11.5px;min-height:36px}}
</style></head>
<body>
<nav class="quick-nav" aria-label="페이지 빠른 이동">
 <div id="navList" class="nav-list"><div class="loading">메뉴 불러오는 중…</div></div>
</nav>
<script src="/js/config.js"></script>
<script>
(function(){
const API=(window.ARTMUG_CONFIG||{}).API_BASE||'',RAW='https://raw.githubusercontent.com/kizzzeee0-cmyk/artmug-design-portfolio/main/',root=document.getElementById('navList'),CACHE_KEY='artmug-nav-summary-v9';
const ch=('BroadcastChannel' in window)?new BroadcastChannel('artmug-portfolio-section-nav'):null;
let currentSummary={};
const api=async p=>{const r=await fetch(API+p,{credentials:'include'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()};
const raw=async p=>{const r=await fetch(RAW+p,{cache:'no-cache'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()};
function layout(c){
 const id=String(c?.id||''),label=String(c?.label||'').replace(/\s/g,'');
 if(id==='top-banner'||label.includes('상단배너'))return'top-banner';
 if(id==='floating-banner'||label.includes('플로팅'))return'floating-banner';
 if(id==='bottom-banner'||label.includes('하단배너일반'))return'bottom-banner';
 if(id==='bottom-split'||label.includes('하단배너분할'))return'bottom-split';
 if(/^profile(?:-|$)/.test(id)||label.includes('움짤프사'))return'profile';
 if(/4cut|four-cut/.test(id)||label.includes('인생네컷'))return'four-cut';
 return id
}
function summarize(settings,index,presets){
 const meta=settings.portfolioMeta||{},pm=settings.presetMeta||{};
 const cats=(settings.portfolioCategories||[]).filter(c=>c.enabled!==false&&!c.hiddenLegacy),catById=new Map(cats.map(c=>[c.id,c]));
 const works=(Array.isArray(index)?index:[]).filter(x=>x&&catById.has(x.category)&&(meta[x.file]||{}).enabled!==false);
 const banners=new Set(['top-banner','floating-banner','bottom-banner','bottom-split']);
 const bannerWorks=works.filter(x=>banners.has(layout(catById.get(x.category))));
 const presetItems=(Array.isArray(presets)?presets:[]).filter(x=>x&&x.enabled!==false&&(pm[x.file]||{}).enabled!==false&&((pm[x.file]||{}).showcaseKind||'preset')!=='fixed');
 const bannerIds=[...new Set(bannerWorks.map(x=>x.category))];
 const visibleNonBanner=cats.filter(c=>!banners.has(layout(c))&&works.some(x=>x.category===c.id));
 const profile=visibleNonBanner.find(c=>layout(c)==='profile');
 const fourCut=visibleNonBanner.find(c=>layout(c)==='four-cut');
 const extraCategories=visibleNonBanner
  .filter(c=>layout(c)!=='profile'&&layout(c)!=='four-cut')
  .map(c=>({id:c.id,label:String(c.label||c.id)}));
 return {
  hasPreset:settings.presetEnabled!==false&&settings.showcasePresetEnabled!==false&&presetItems.length>0,
  hasBanner:bannerWorks.length>0,
  bannerIds,
  profile:profile?{id:profile.id,label:'움짤프사'}:null,
  fourCut:fourCut?{id:fourCut.id,label:'인생네컷'}:null,
  extraCategories
 }
}
function send(target){
 if(ch)ch.postMessage({type:'navigate',target});
 try{for(let i=0;i<window.top.length;i++)try{window.top.frames[i].postMessage({type:'artmug-section-nav',target},'*')}catch{}}catch{}
 try{window.parent.postMessage({type:'artmug-section-nav',target},'*')}catch{}
 root.querySelectorAll('button').forEach(b=>b.classList.toggle('is-active',b.dataset.target===target))
}
function listFrom(d){
 currentSummary=d||{};
 const list=[{label:'공지사항',target:'notice'}];
 if(d.hasPreset)list.push({label:'프리셋',target:'showcase'});
 if(d.profile)list.push({label:'움짤프사',target:'portfolio:'+d.profile.id});
 if(d.hasBanner)list.push({label:'SOOP 배너',target:'banner:all'});
 if(d.fourCut)list.push({label:'인생네컷',target:'portfolio:'+d.fourCut.id});
 (Array.isArray(d.extraCategories)?d.extraCategories:[]).forEach(c=>list.push({label:c.label,target:'portfolio:'+c.id}));
 list.push({divider:true},{label:'문의 양식',target:'inquiry',cls:'inquiry-button'},{label:'TOP',target:'top',cls:'top-button'});
 return list
}
function normalizeActiveTarget(target){
 target=String(target||'');
 if(target.startsWith('showcase-'))return'showcase';
 if(target==='banner:A'||target==='banner:B'||target==='banner:all')return'banner:all';
 if(target.startsWith('portfolio:')){
  const id=target.split(':')[1];
  if((currentSummary.bannerIds||[]).includes(id))return'banner:all'
 }
 return target
}
function show(items){
 root.innerHTML=items.map(x=>x.divider?'<div class="divider" aria-hidden="true"></div>':'<button type="button" class="'+(x.cls||'')+'" data-target="'+x.target+'">'+(x.target==='top'?'TOP <span class="top-arrow" aria-hidden="true">▲</span>':x.label)+'</button>').join('');
 root.querySelectorAll('[data-target]').forEach(b=>b.addEventListener('click',()=>send(b.dataset.target)))
}
function cached(){try{const x=JSON.parse(sessionStorage.getItem(CACHE_KEY)||'null');return x&&Date.now()-x.time<60000?x.data:null}catch{return null}}
function saveCache(data){try{sessionStorage.setItem(CACHE_KEY,JSON.stringify({time:Date.now(),data}))}catch{}}
async function init(){
 const old=cached();if(old)show(listFrom(old));
 try{
  const [d,index,presets]=await Promise.all([api('/api/public/settings?fresh='+Date.now()),raw('portfolio/index.json'),raw('site/data/presets.json')]);
  const summary=summarize(d.settings||{},index,presets);saveCache(summary);show(listFrom(summary))
 }catch{if(!old)show([{label:'공지사항',target:'notice'},{divider:true},{label:'문의 양식',target:'inquiry',cls:'inquiry-button'},{label:'TOP',target:'top',cls:'top-button'}])}
}
if(ch)ch.addEventListener('message',e=>{
 const d=e.data;
 if(d?.type==='nav-data'){
  const cats=Array.isArray(d.categories)?d.categories:[];
  const nonBanner=cats.filter(c=>!c.banner);
  const profile=nonBanner.find(c=>c.kind==='profile');
  const fourCut=nonBanner.find(c=>c.kind==='four-cut');
  const summary={
   hasPreset:!!d.preset,
   hasBanner:cats.some(c=>c.banner),
   bannerIds:cats.filter(c=>c.banner).map(c=>c.id),
   profile:profile?{id:profile.id,label:'움짤프사'}:null,
   fourCut:fourCut?{id:fourCut.id,label:'인생네컷'}:null,
   extraCategories:nonBanner
    .filter(c=>c.kind!=='profile'&&c.kind!=='four-cut')
    .map(c=>({id:c.id,label:String(c.label||c.id)}))
  };
  saveCache(summary);show(listFrom(summary));return
 }
 if(d?.type==='active'){
  const target=normalizeActiveTarget(d.target);
  root.querySelectorAll('button').forEach(b=>b.classList.toggle('is-active',b.dataset.target===target))
 }
});
window.addEventListener('message',e=>{
 const d=e.data;
 if(d&&d.type==='artmug-active-section'&&d.target){
  const target=normalizeActiveTarget(d.target);
  root.querySelectorAll('button').forEach(b=>b.classList.toggle('is-active',b.dataset.target===target))
 }
});
init()
})();;;
</script></body></html>
