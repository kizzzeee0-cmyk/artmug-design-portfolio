<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>빠른 이동</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/subsets/Paperlogy-dynamic-subset.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;font-family:"Paperlogy",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;color:#344651;overflow:visible}
body{display:flex;justify-content:flex-start;align-items:safe center;min-height:100vh;min-height:100dvh;padding:18px 0 18px 8px}
.quick-shell{
  position:sticky;
  top:50%;
  transform:translateY(-50%);
  width:calc(100% - 8px);
  max-width:194px;
  min-width:0;
  padding:18px 13px 16px;
  border:1.5px solid #d7e9f4;
  border-radius:30px;
  background:#fff;
  box-shadow:0 8px 24px rgba(104,164,198,.10);
  overflow:visible;
}
body:not(.menu-ready) .quick-shell{visibility:hidden}
.quick-work-status{
  position:absolute;
  top:-13px;
  right:-3px;
  z-index:3;
  display:block;
  margin:0
}
.quick-work-status[hidden]{display:none!important}
.quick-work-status-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  min-height:25px;
  padding:5px 8px;
  border:1px solid rgba(143,201,232,.30);
  border-radius:999px;
  background:#eef8fd;
  color:#528eaf;
  font-size:10px;
  font-weight:700;
  line-height:1;
  white-space:nowrap;
  box-shadow:none
}
.quick-work-status-dot{width:6px;height:6px;flex:0 0 6px;border-radius:50%;background:#79badd}
.quick-work-status[data-status="sleeping"] .quick-work-status-badge{background:#f5f9fb;border-color:#dce8ee;color:#6e7d86}
.quick-work-status[data-status="sleeping"] .quick-work-status-dot{background:#91a8b5}
.quick-menu-title{
  margin:2px 0 13px;
  color:#46647a;
  font-size:15px;
  font-weight:800;
  line-height:1.2;
  letter-spacing:.025em;
  text-align:center
}
.quick-divider{
  width:100%;
  height:1px;
  margin:0;
  border:0;
  background:#dcecf4
}
.quick-divider.is-title{margin-bottom:14px}
.quick-divider.is-action{margin:15px 0 12px}
.nav-list{display:grid;gap:9px}
.quick-nav-button{
  display:grid;
  grid-template-columns:19px minmax(0,1fr) 19px;
  align-items:center;
  column-gap:9px;
  width:100%;
  min-height:42px;
  padding:8px 14px;
  border:1px solid #d7e9f4;
  border-radius:999px;
  background:#fff;
  color:#557287;
  font:inherit;
  font-size:12.5px;
  font-weight:650;
  line-height:1.25;
  text-align:left;
  cursor:pointer;
  box-shadow:none;
  transition:background .14s ease,border-color .14s ease,color .14s ease
}
.quick-nav-button:hover,.quick-nav-button:focus-visible{background:#f2f9fd;border-color:#b9dff2;color:#4f8fb3;outline:none}
.quick-nav-button.is-active{background:#eef8fd;border-color:#8fc9e8;color:#4f8fb3}
.quick-inquiry-section[hidden]{display:none!important}
.quick-inquiry-button{
  display:grid;
  grid-template-columns:19px minmax(0,1fr) 19px;
  align-items:center;
  column-gap:9px;
  width:100%;
  min-height:42px;
  padding:8px 14px;
  border:1px solid #8fc9e8;
  border-radius:999px;
  background:#8fc9e8;
  color:#fff;
  font:inherit;
  font-size:12.5px;
  font-weight:700;
  line-height:1.25;
  text-align:left;
  cursor:pointer;
  box-shadow:none
}
.quick-inquiry-button .quick-nav-icon{color:#fff}
.quick-inquiry-button:hover,.quick-inquiry-button:focus-visible{background:#79badd;border-color:#79badd;color:#fff;outline:none}
.quick-inquiry-button.is-active{background:#69add2;border-color:#69add2;color:#fff}
.quick-inquiry-section + .quick-top-wrap{margin-top:11px}
.quick-inquiry-section[hidden] + .quick-top-wrap{margin-top:0}
.quick-nav-icon{
  width:19px;
  height:19px;
  flex:0 0 19px;
  display:grid;
  place-items:center;
  color:#8fc9e8
}
.quick-nav-icon svg{display:block;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.quick-nav-balance{width:19px;height:1px;justify-self:center}
.quick-nav-label{grid-column:2;min-width:0;overflow-wrap:anywhere;text-align:center;justify-self:stretch}
.quick-top-wrap{display:flex;justify-content:center;align-items:center;min-height:44px}
.quick-top-button{
  position:relative;
  width:44px;
  height:44px;
  padding:0;
  border:0;
  border-radius:50%;
  background:transparent;
  color:#7fbada;
  font:inherit;
  cursor:pointer;
  box-shadow:none;
  display:grid;
  place-items:center
}
.quick-top-button::before{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:35px;
  height:35px;
  transform:translate(-50%,-50%);
  border:1px solid #d7e9f4;
  border-radius:50%;
  background:#fff;
  transition:background .14s ease,border-color .14s ease
}
.quick-top-button:hover::before,.quick-top-button:focus-visible::before{background:#f2f9fd;border-color:#a9d7ed}
.quick-top-button:hover,.quick-top-button:focus-visible{color:#5ea6cd;outline:none}
.quick-top-content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:35px;height:35px;line-height:1;text-align:center;transform:translate(.75px,.25px)}
.quick-top-arrow{display:block;width:8.4px;height:5.6px;overflow:visible}
.quick-top-arrow svg{display:block;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.quick-top-text{display:block;width:100%;font-size:7.7px;font-weight:800;line-height:1;text-align:center;letter-spacing:.015em}
.loading{padding:14px 4px;text-align:center;color:#71818c;font-size:11px}
@media(max-height:620px){body{align-items:flex-start;padding-top:14px;padding-bottom:14px}.quick-shell{top:14px;transform:none}}
@media(max-width:165px){
  body{padding-left:4px}
  .quick-shell{width:calc(100% - 4px);padding:15px 9px 13px;border-radius:25px}
  .quick-work-status{top:-11px;right:-2px}
  .quick-work-status-badge{min-height:22px;padding:4px 6px;font-size:8.8px}
  .quick-menu-title{font-size:13px;margin-bottom:11px}
  .quick-divider.is-title{margin-bottom:11px}
  .nav-list{gap:7px}
  .quick-nav-button{grid-template-columns:16px minmax(0,1fr) 16px;min-height:36px;padding:6px 10px;column-gap:7px;font-size:11px}
  .quick-nav-icon{width:16px;height:16px;flex-basis:16px}
  .quick-nav-balance{width:16px}
  .quick-divider.is-action{margin:12px 0 10px}
  .quick-inquiry-button{grid-template-columns:16px minmax(0,1fr) 16px;min-height:36px;padding:6px 10px;column-gap:7px;font-size:11px}
  .quick-inquiry-section + .quick-top-wrap{margin-top:9px}
  .quick-top-wrap{min-height:40px}
  .quick-top-button{width:40px;height:40px}
  .quick-top-button::before{width:31px;height:31px}
  .quick-top-content{width:31px;height:31px;gap:2px;transform:translate(.6px,.25px)}
  .quick-top-arrow{width:7.35px;height:4.9px}
  .quick-top-text{font-size:7px}
}

/* 2026-10-17 QUICK MENU PAGINATION + TRUE CENTER */
body{
  align-items:center!important;
  min-height:100vh!important;
  min-height:100dvh!important;
  height:100vh!important;
  height:100dvh!important;
  padding-top:22px!important;
  padding-bottom:22px!important;
  overflow:hidden!important;
}
.quick-shell{
  position:relative!important;
  top:auto!important;
  transform:none!important;
  display:flex!important;
  flex-direction:column!important;
  max-height:calc(100vh - 44px)!important;
  max-height:calc(100dvh - 44px)!important;
}
.quick-menu-title,
.quick-divider,
.quick-pagination,
.quick-inquiry-section,
.quick-top-wrap{
  flex:0 0 auto;
}
.nav-list{
  min-height:0!important;
  overflow-y:auto!important;
  overscroll-behavior:contain;
  scrollbar-width:none;
}
.nav-list::-webkit-scrollbar{display:none}
.quick-pagination{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  min-height:28px;
  margin:9px 0 0;
  color:#7d8e99;
  font-size:10px;
  font-weight:700;
  line-height:1;
}
.quick-pagination[hidden]{display:none!important}
.quick-page-button{
  width:25px;
  height:25px;
  display:grid;
  place-items:center;
  padding:0;
  border:0;
  border-radius:999px;
  background:transparent;
  color:#8fc9e8;
  cursor:pointer;
  transition:background .14s ease,color .14s ease;
}
.quick-page-button:hover,.quick-page-button:focus-visible{
  background:#eef8fd;
  color:#5ea6cd;
  outline:none;
}
.quick-page-button:disabled{
  color:#cbdce5;
  cursor:default;
  background:transparent;
}
.quick-page-button svg{
  width:7px;
  height:11px;
  display:block;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.quick-page-status{
  min-width:35px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.quick-page-current{color:#5c7180;font-weight:800}
.quick-page-separator{color:#b1c0c9;font-weight:500}
@media(max-height:560px){
  body{
    padding-top:18px!important;
    padding-bottom:18px!important;
  }
  .quick-shell{
    max-height:calc(100vh - 36px)!important;
    max-height:calc(100dvh - 36px)!important;
  }
}

/* 2026-10-17 QUICK MENU NO ICONS + NO INNER SCROLL */
.quick-nav-button,
.quick-inquiry-button{
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  grid-template-columns:none!important;
  column-gap:0!important;
  text-align:center!important;
}
.quick-nav-icon,
.quick-nav-balance{
  display:none!important;
}
.quick-nav-label{
  grid-column:auto!important;
  width:100%;
  min-width:0;
  text-align:center!important;
  white-space:nowrap!important;
  overflow-wrap:normal!important;
  word-break:keep-all!important;
}
.nav-list{
  overflow:visible!important;
  min-height:auto!important;
  scrollbar-width:auto!important;
}
.nav-list::-webkit-scrollbar{display:none}
.quick-shell{
  max-height:none!important;
  overflow:visible!important;
}
@media(max-height:850px){
  .quick-shell{
    transform:translateY(-30px)!important;
  }
}
@media(max-height:720px){
  .quick-shell{
    transform:translateY(-42px)!important;
  }
}
@media(max-height:600px){
  .quick-shell{
    transform:translateY(-48px)!important;
  }
}
@media(max-width:165px){
  .quick-nav-button,
  .quick-inquiry-button{
    padding-left:8px!important;
    padding-right:8px!important;
  }
  .quick-nav-label{
    font-size:10.5px!important;
    letter-spacing:-.02em;
  }
}
</style></head>
<body>
<nav class="quick-shell" aria-label="페이지 빠른 이동">
  <div id="quickWorkStatus" class="quick-work-status" hidden aria-live="polite"><div class="quick-work-status-badge"><span class="quick-work-status-dot" aria-hidden="true"></span><span id="quickWorkStatusLabel"></span></div></div>
  <div class="quick-menu-title">MENU</div>
  <div class="quick-divider is-title" aria-hidden="true"></div>
  <div id="navList" class="nav-list"><div class="loading">메뉴 불러오는 중…</div></div>
  <div id="quickPagination" class="quick-pagination" hidden aria-label="퀵 메뉴 페이지">
    <button id="quickPagePrev" type="button" class="quick-page-button" aria-label="이전 메뉴 페이지"><svg viewBox="0 0 8 12" aria-hidden="true"><path d="M6.5 1.5 2 6l4.5 4.5"/></svg></button>
    <span class="quick-page-status"><strong id="quickPageCurrent" class="quick-page-current">1</strong><span class="quick-page-separator">/</span><span id="quickPageTotal">1</span></span>
    <button id="quickPageNext" type="button" class="quick-page-button" aria-label="다음 메뉴 페이지"><svg viewBox="0 0 8 12" aria-hidden="true"><path d="M1.5 1.5 6 6l-4.5 4.5"/></svg></button>
  </div>
  <div id="quickInquirySection" class="quick-inquiry-section" hidden>
    <div class="quick-divider is-action" aria-hidden="true"></div>
    <button id="quickInquiryButton" type="button" class="quick-inquiry-button" data-target="inquiry"><span class="quick-nav-label">문의양식</span></button>
  </div>
  <div class="quick-top-wrap"><button id="quickTopButton" type="button" class="quick-top-button" data-target="top" aria-label="페이지 상단으로 이동"><span class="quick-top-content"><span class="quick-top-arrow" aria-hidden="true"><svg viewBox="0 0 12 8"><path d="M1 6 6 1l5 5"/></svg></span><span class="quick-top-text">TOP</span></span></button></div>
</nav>
<script src="/js/config.js"></script>
<script>
(function(){
const API=(window.ARTMUG_CONFIG||{}).API_BASE||'',root=document.getElementById('navList'),CACHE_KEY='artmug-nav-summary-v15';
const ch=('BroadcastChannel' in window)?new BroadcastChannel('artmug-portfolio-section-nav'):null;
let currentSummary={},liveWorkStatus=null,quickItems=[],quickPage=0,quickActiveTarget='';
const QUICK_PAGE_SIZE=5;
const api=async p=>{const r=await fetch(API+p,{credentials:'include'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()};
function layout(c){
 const id=String(c?.id||''),label=String(c?.label||'').replace(/\s/g,'');
 if(id==='top-banner'||label.includes('상단배너'))return'top-banner';
 if(id==='floating-banner'||label.includes('플로팅'))return'floating-banner';
 if(id==='bottom-banner'||label.includes('하단배너일반'))return'bottom-banner';
 if(id==='bottom-split'||label.includes('하단배너분할'))return'bottom-split';
 if(/^profile(?:-|$)/.test(id)||label.includes('움짤프사'))return'profile';
 if(/4cut|four-cut/.test(id)||label.includes('인생네컷'))return'four-cut';
 return id
}
function summarize(settings,index,presets){
 const meta=settings.portfolioMeta||{},pm=settings.presetMeta||{};
 const cats=(settings.portfolioCategories||[]).filter(c=>c.enabled!==false&&!c.hiddenLegacy),catById=new Map(cats.map(c=>[c.id,c]));
 const works=(Array.isArray(index)?index:[]).filter(x=>x&&catById.has(x.category)&&(meta[x.file]||{}).enabled!==false);
 const banners=new Set(['top-banner','floating-banner','bottom-banner','bottom-split']);
 const bannerWorks=works.filter(x=>banners.has(layout(catById.get(x.category))));
 const presetItems=(Array.isArray(presets)?presets:[]).filter(x=>x&&x.enabled!==false&&(pm[x.file]||{}).enabled!==false&&((pm[x.file]||{}).showcaseKind||'preset')!=='fixed');
 const bannerIds=[...new Set(bannerWorks.map(x=>x.category))];
 const visibleNonBanner=cats.filter(c=>!banners.has(layout(c))&&works.some(x=>x.category===c.id));
 const profile=visibleNonBanner.find(c=>layout(c)==='profile');
 const fourCut=visibleNonBanner.find(c=>layout(c)==='four-cut');
 const extraCategories=visibleNonBanner
  .filter(c=>layout(c)!=='profile'&&layout(c)!=='four-cut')
  .map(c=>({id:c.id,label:String(c.label||c.id)}));
 return {
  hasPreset:settings.presetEnabled!==false&&settings.showcasePresetEnabled!==false&&presetItems.length>0,
  hasFixed:settings.fixedEnabled!==false&&(
   (Array.isArray(settings.fixedProducts)&&settings.fixedProducts.some(p=>p&&p.enabled!==false&&Array.isArray(p.previews)&&p.previews.some(v=>v&&v.file&&v.enabled!==false)))||
   (Array.isArray(presets)&&presets.some(x=>x&&x.enabled!==false&&(pm[x.file]||{}).enabled!==false&&(pm[x.file]||{}).showcaseKind==='fixed'))
  ),
  hasBanner:bannerWorks.length>0,
  bannerIds,
  profile:profile?{id:profile.id,label:'움짤프사'}:null,
  fourCut:fourCut?{id:fourCut.id,label:'인생네컷'}:null,
  extraCategories
 }
}
function send(target){
 if(ch)ch.postMessage({type:'navigate',target});
 try{for(let i=0;i<window.top.length;i++)try{window.top.frames[i].postMessage({type:'artmug-section-nav',target},'*')}catch{}}catch{}
 try{window.parent.postMessage({type:'artmug-section-nav',target},'*')}catch{}
 setActiveTarget(target)
}
function listFrom(d){
 currentSummary=d||{};
 const list=[{label:'공지사항',target:'notice'}];
 if(d.hasFixed||d.hasPreset){
  list.push({
   label:d.hasFixed&&d.hasPreset?'고정틀 · 프리셋':d.hasFixed?'고정틀':'프리셋',
   target:d.hasFixed?'fixed':'showcase'
  })
 }
 if(d.profile)list.push({label:'움짤프사',target:'portfolio:'+d.profile.id});
 if(d.hasBanner)list.push({label:'SOOP 배너',target:'banner:all'});
 if(d.fourCut)list.push({label:'인생네컷',target:'portfolio:'+d.fourCut.id});
 (Array.isArray(d.extraCategories)?d.extraCategories:[]).forEach(c=>list.push({label:c.label,target:'portfolio:'+c.id}));
 list.push({label:'문의양식',target:'inquiry',cls:'inquiry-button'});
 return list
}
function normalizeActiveTarget(target){
 target=String(target||'');
 if(target.startsWith('showcase-'))target='showcase';
 if(currentSummary.hasFixed&&currentSummary.hasPreset&&(target==='fixed'||target==='showcase'))return'fixed';
 if(target==='banner:A'||target==='banner:B'||target==='banner:all')return'banner:all';
 if(target.startsWith('portfolio:')){
  const id=target.split(':')[1];
  if((currentSummary.bannerIds||[]).includes(id))return'banner:all'
 }
 return target
}
function renderQuickPage(){
 const pages=Math.max(1,Math.ceil(quickItems.length/QUICK_PAGE_SIZE));
 quickPage=Math.max(0,Math.min(quickPage,pages-1));
 const start=quickPage*QUICK_PAGE_SIZE;
 const visible=quickItems.slice(start,start+QUICK_PAGE_SIZE);
 root.innerHTML=visible.map(x=>'<button type="button" class="quick-nav-button '+(x.cls||'')+(x.target===quickActiveTarget?' is-active':'')+'" data-target="'+x.target+'"><span class="quick-nav-label">'+x.label+'</span></button>').join('');
 root.querySelectorAll('[data-target]').forEach(b=>b.addEventListener('click',()=>send(b.dataset.target)));
 const pager=document.getElementById('quickPagination');
 const prev=document.getElementById('quickPagePrev');
 const next=document.getElementById('quickPageNext');
 const current=document.getElementById('quickPageCurrent');
 const total=document.getElementById('quickPageTotal');
 if(pager)pager.hidden=pages<=1;
 if(current)current.textContent=String(quickPage+1);
 if(total)total.textContent=String(pages);
 if(prev){prev.disabled=quickPage<=0;prev.onclick=()=>{if(quickPage>0){quickPage--;renderQuickPage()}}}
 if(next){next.disabled=quickPage>=pages-1;next.onclick=()=>{if(quickPage<pages-1){quickPage++;renderQuickPage()}}}
}
function setActiveTarget(target){
 const normalized=normalizeActiveTarget(target);
 quickActiveTarget=normalized;
 const index=quickItems.findIndex(x=>x.target===normalized);
 if(index>=0){
  const page=Math.floor(index/QUICK_PAGE_SIZE);
  if(page!==quickPage){quickPage=page;renderQuickPage();return}
 }
 document.querySelectorAll('.quick-shell [data-target]').forEach(b=>b.classList.toggle('is-active',b.dataset.target===normalized))
}
function iconSvg(item){
 const target=String(item?.target||''),label=String(item?.label||'');
 const common='viewBox="0 0 24 24" aria-hidden="true"';
 if(target==='notice'||label.includes('공지'))return '<svg '+common+'><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>';
 if(target==='fixed'||label.includes('고정틀'))return '<svg '+common+'><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></svg>';
 if(target==='showcase'||label.includes('프리셋'))return '<svg '+common+'><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21H10.4v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-3.2h-.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h3.2v.1A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.35.28.57.67.6 1.1v.3h.1V13.6H20a1.7 1.7 0 0 0-.6 1.4Z"/></svg>';
 if(target.startsWith('portfolio:')&&label.includes('움짤'))return '<svg '+common+'><circle cx="12" cy="8" r="3"/><path d="M5.5 19c.8-3.8 3.1-6 6.5-6s5.7 2.2 6.5 6"/></svg>';
 if(target==='banner:all'||label.includes('배너'))return '<svg '+common+'><rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="9" cy="10" r="1.4"/><path d="m5.5 17 4.1-4 3.1 2.7 2.2-2.1 3.6 3.4"/></svg>';
 if(target.startsWith('portfolio:')&&label.includes('네컷'))return '<svg '+common+'><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h8M8 17h8"/></svg>';
 if(target==='inquiry'||label.includes('문의'))return '<svg '+common+'><path d="M4 5h16v11H8l-4 4V5Z"/><path d="M8 9h8M8 12h5"/></svg>';
 return '<svg '+common+'><circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8"/></svg>'
}
function show(items){
 const inquiry=items.find(x=>x.target==='inquiry');
 const categories=items.filter(x=>x.target!=='inquiry');
 quickItems=categories;
 const pages=Math.max(1,Math.ceil(quickItems.length/QUICK_PAGE_SIZE));
 quickPage=Math.max(0,Math.min(quickPage,pages-1));
 renderQuickPage();
 const inquirySection=document.getElementById('quickInquirySection');
 const inquiryButton=document.getElementById('quickInquiryButton');
 if(inquirySection&&inquiryButton){
  inquirySection.hidden=!inquiry;
  if(inquiry){
   inquiryButton.querySelector('.quick-nav-label').textContent=inquiry.label;
   if(!inquiryButton.dataset.bound){inquiryButton.dataset.bound='1';inquiryButton.addEventListener('click',()=>send('inquiry'))}
  }
 }
 const top=document.getElementById('quickTopButton');
 if(top&&!top.dataset.bound){top.dataset.bound='1';top.addEventListener('click',()=>send('top'))}
 document.body.classList.add('menu-ready')
}
function summaryFromNav(d){
 const cats=Array.isArray(d?.categories)?d.categories:[];
 const nonBanner=cats.filter(c=>!c.banner);
 const profile=nonBanner.find(c=>c.kind==='profile');
 const fourCut=nonBanner.find(c=>c.kind==='four-cut');
 return {
  hasPreset:!!d?.hasPreset,
  hasFixed:!!d?.hasFixed,
  hasBanner:cats.some(c=>c.banner),
  bannerIds:cats.filter(c=>c.banner).map(c=>c.id),
  profile:profile?{id:profile.id,label:'움짤프사'}:null,
  fourCut:fourCut?{id:fourCut.id,label:'인생네컷'}:null,
  extraCategories:nonBanner
   .filter(c=>c.kind!=='profile'&&c.kind!=='four-cut')
   .map(c=>({id:c.id,label:String(c.label||c.id)})),
  workStatus:{
   enabled:d?.workStatus?.enabled===true,
   mode:d?.workStatus?.mode==='sleeping'?'sleeping':'working',
   description:String(d?.workStatus?.description||'')
  }
 }
}
function mergeFrameNavData(d){
 const cats=Array.isArray(d?.categories)?d.categories:[];
 if(!cats.length)return null;
 const frame=summaryFromNav({
  hasPreset:d?.preset===true,
  hasFixed:d?.fixed===true,
  categories:cats,
  workStatus:currentSummary?.workStatus
 });
 const extras=new Map();
 (Array.isArray(currentSummary?.extraCategories)?currentSummary.extraCategories:[]).forEach(x=>extras.set(x.id,x));
 (Array.isArray(frame.extraCategories)?frame.extraCategories:[]).forEach(x=>extras.set(x.id,x));
 return {
  ...currentSummary,
  hasPreset:currentSummary?.hasPreset===true||frame.hasPreset===true,
  hasFixed:currentSummary?.hasFixed===true||frame.hasFixed===true,
  hasBanner:currentSummary?.hasBanner===true||frame.hasBanner===true,
  bannerIds:[...new Set([...(currentSummary?.bannerIds||[]),...(frame.bannerIds||[])])],
  profile:frame.profile||currentSummary?.profile||null,
  fourCut:frame.fourCut||currentSummary?.fourCut||null,
  extraCategories:[...extras.values()],
  workStatus:currentSummary?.workStatus||frame.workStatus
 }
}
function summaryKey(d){try{return JSON.stringify(d||{})}catch{return''}}
function renderWorkStatus(status){
 const box=document.getElementById('quickWorkStatus');
 if(!box)return;
 const enabled=status?.enabled===true;
 box.hidden=!enabled;
 if(!enabled)return;
 const mode=status?.mode==='sleeping'?'sleeping':'working';
 box.dataset.status=mode;
 const label=document.getElementById('quickWorkStatusLabel');
 const desc=document.getElementById('quickWorkStatusDescription');
 if(label)label.textContent=mode==='sleeping'?'취침중':'작업중';
 const text=String(status?.description||'').trim();
 if(desc){desc.textContent=text;desc.hidden=!text}
}
function renderSummary(d){
 if(summaryKey(currentSummary)===summaryKey(d)&&document.body.classList.contains('menu-ready'))return;
 renderWorkStatus(liveWorkStatus||d?.workStatus);
 show(listFrom(d))
}
function cached(){try{const x=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');return x&&Date.now()-x.time<21600000?x.data:null}catch{return null}}
function saveCache(data){try{localStorage.setItem(CACHE_KEY,JSON.stringify({time:Date.now(),data}))}catch{}}
async function init(){
 const old=cached();
 try{
  const d=await api('/api/public/nav-summary');
  const summary=summaryFromNav(d);
  saveCache(summary);
  renderSummary(summary)
 }catch{
  if(old)renderSummary(old);
  else renderSummary({hasPreset:false,hasBanner:false,bannerIds:[],profile:null,fourCut:null,extraCategories:[],workStatus:{enabled:false,mode:'working',description:''}})
 }
}
if(ch)ch.addEventListener('message',e=>{
 const d=e.data;
 if(d?.type==='work-status'){
  liveWorkStatus={enabled:d.enabled===true,mode:d.mode==='sleeping'?'sleeping':'working',description:String(d.description||'')};
  renderWorkStatus(liveWorkStatus);
  return
 }
 if(d?.type==='nav-data'){
  const updated=mergeFrameNavData(d);
  if(updated){
   saveCache(updated);
   renderSummary(updated)
  }else if(currentSummary&&typeof d.fixed==='boolean'&&d.fixed===true&&currentSummary.hasFixed!==true){
   const fixedOnly={...currentSummary,hasFixed:true};
   saveCache(fixedOnly);renderSummary(fixedOnly)
  }
  return
 }
 if(d?.type==='active'){
  const target=normalizeActiveTarget(d.target);
  setActiveTarget(target)
 }
});
window.addEventListener('message',e=>{
 const d=e.data;
 if(d&&d.type==='artmug-active-section'&&d.target){
  const target=normalizeActiveTarget(d.target);
  setActiveTarget(target)
 }
});
init()
})();;;
</script></body></html>
