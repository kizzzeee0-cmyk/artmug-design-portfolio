const API='https://artmug-portfolio-api.kizzzeee0.workers.dev/media/';
const RAW='https://raw.githubusercontent.com/kizzzeee0-cmyk/artmug-design-portfolio/main/';
const logical=id=>/^profile(?:-|$)/.test(String(id||''))?'profile':String(id||'');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const api=f=>API+String(f).split('/').map(encodeURIComponent).join('/');
const raw=f=>RAW+String(f).split('/').map(encodeURIComponent).join('/');
const hidden=new Set(SNAPSHOT.hidden||[]);
const pos=new Map((SNAPSHOT.order||[]).map((f,i)=>[f,i]));
const items=(SNAPSHOT.items||[]).filter(x=>x.f&&!hidden.has(x.f)).sort((a,b)=>(pos.get(a.f)??1e9)-(pos.get(b.f)??1e9));
const root=document.getElementById('cats');
root.innerHTML=(SNAPSHOT.cats||[]).map(cat=>{
 const list=items.filter(x=>logical(x.c)===cat.id);
 if(!list.length)return '';
 return '<details class="cat" '+(cat.id==='top-banner'?'open':'')+'><summary>'+esc(cat.label)+'<span>'+list.length+'개</span></summary><div class="works">'+list.map(x=>'<button class="work" type="button" data-file="'+esc(x.f)+'" data-alt="'+esc(x.a||cat.label)+'">'+esc(x.a||cat.label)+'</button>').join('')+'</div></details>'

let token=0,timer=0;
const preview=document.getElementById('preview'),img=document.getElementById('previewImg'),title=document.getElementById('previewTitle'),status=document.getElementById('previewStatus'),rawLink=document.getElementById('rawLink');
function show(file,alt){
 token++;const mine=token;clearTimeout(timer);preview.classList.add('on');title.textContent=alt||'작품 미리보기';status.textContent='이미지를 불러오는 중…';img.removeAttribute('src');img.alt=alt||'';rawLink.href=raw(file);preview.scrollIntoView({behavior:'smooth',block:'start'});
 let fallback=false;
 const start=src=>{if(mine!==token)return;clearTimeout(timer);timer=setTimeout(()=>{if(mine!==token)return;if(!fallback){fallback=true;status.textContent='대체 경로로 다시 불러오는 중…';start(raw(file))}else{status.textContent='연결이 너무 느립니다. 원본 새 탭 링크를 이용해 주세요.'}},25000);img.src=src};
 img.onload=()=>{if(mine!==token)return;clearTimeout(timer);status.textContent='불러오기 완료'};
 img.onerror=()=>{if(mine!==token)return;if(!fallback){fallback=true;status.textContent='대체 경로로 다시 불러오는 중…';start(raw(file))}else{clearTimeout(timer);status.textContent='이미지를 불러오지 못했습니다. 원본 새 탭 링크를 이용해 주세요.'}};
 start(api(file));
}
